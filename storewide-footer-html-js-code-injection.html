<!-- LAB DECORATOR — footer bootstrap (paste once into Payhip, never again)
     Loads the remote engine; every future git push goes live automatically.
     Engine source: storewide-footer-engine.js (repo root). Brand stays dynamic.
     NOTE: raw URL is repo-root based (…/main/storewide-footer-engine.js). -->
<script>
(function () {
  try {
    if (window.__labEngineLoaded) return;
    window.__labEngineLoaded = true;
    var v = Date.now();
    var urls = [
      'https://raw.githubusercontent.com/Th3Tamas/store-theme/main/storewide-footer-engine.js?v=' + v,
      'https://cdn.jsdelivr.net/gh/Th3Tamas/store-theme@main/storewide-footer-engine.js?v=' + v
    ];
    var load = function (i) {
      if (i >= urls.length) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = urls[i];
      s.onerror = function () { load(i + 1); };
      document.body.appendChild(s);
    };
    load(0);
  } catch (e) { /* no-op: never break native footer */ }
})();
</script>
