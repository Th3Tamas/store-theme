<style>

<script>
  (function() {
    var isDismissed = false;

    function dismissPreloader() {
      isDismissed = true;
      try {
        var ids = ['sonarline-preloader', 'sonarline-hud-preloader'];
        for (var i = 0; i < ids.length; i++) {
          var el = document.getElementById(ids[i]);
          if (el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('pointer-events', 'none', 'important');
            if (typeof el.remove === 'function') {
              el.remove();
            } else if (el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }
        }
        if (preloader) {
          preloader.style.setProperty('display', 'none', 'important');
          preloader.style.setProperty('visibility', 'hidden', 'important');
          preloader.style.setProperty('opacity', '0', 'important');
          preloader.style.setProperty('pointer-events', 'none', 'important');
          if (typeof preloader.remove === 'function') {
            preloader.remove();
          } else if (preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }
        if (document.body) {
          document.body.style.removeProperty('overflow');
          document.body.style.overflow = '';
        }
        if (document.documentElement) {
          document.documentElement.style.removeProperty('overflow');
          document.documentElement.style.overflow = '';
        }
        if (!document.body && typeof document.addEventListener === 'function') {
          document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
              document.body.style.removeProperty('overflow');
              document.body.style.overflow = '';
            }
          });
        }
      } catch (err) {
        console.error('dismissPreloader error:', err);
      }
    }

    // Mandatory fail-safe timer: if preloader has not finished within 2.5 seconds, force-dismiss
    var failsafeTimer = setTimeout(function() {
      dismissPreloader();
    }, 2500);

    var preloader = null;

    try {
      // Execution gate: restrict fullscreen preloader strictly to homepage root
      var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '') || '/';
      var isHomepage = (path === '/' || path === '' || path === '/index' || path === '/index.html' || path === '/sonarlineaudio');
      if (!isHomepage) {
        dismissPreloader();
        if (failsafeTimer) clearTimeout(failsafeTimer);
        return;
      }

      // Dynamic Preloader Construction (Homepage only)
      preloader = document.getElementById('sonarline-hud-preloader') || document.getElementById('sonarline-preloader');
      if (!preloader) {
        preloader = document.createElement('div');
        preloader.id = 'sonarline-hud-preloader';
        preloader.innerHTML = '<div class="hud-center-container">' +
          '<div class="hud-brand-header">' +
            '<div class="hud-brand-title" id="hud-brand-title"><span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important;">SONARLINE</span> <span class="hud-slash" style="color: #FF2A2A !important; margin: 0 4px !important; font-weight: 700 !important;">/</span> <span class="hud-title-second" style="color: #FF2A2A !important; font-weight: 400 !important;">lab</span></div>' +
            '<div class="hud-brand-sub" id="hud-brand-sub">SOUND DESIGN LAB</div>' +
          '</div>' +
          '<div class="hud-terminal-readout" id="hud-terminal-readout">' +
            '<div class="hud-line" id="hud-line-0"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
            '<div class="hud-line" id="hud-line-1"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-2"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-3"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-4"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-5"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-6"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-7"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-8"><span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
          '</div>' +
          '<div class="hud-progress-bar-wrap">' +
            '<div class="hud-progress-line"><div class="hud-progress-fill" id="hud-progress-fill"></div></div>' +
            '<div class="hud-progress-footer">' +
              '<div class="hud-progress-status"><span class="hud-ready-sq">&#9632;</span> READY</div>' +
              '<div class="hud-progress-pct" id="hud-progress-pct">0%</div>' +
            '</div>' +
          '</div>' +
        '</div>';
        if (document.body) {
          document.body.insertBefore(preloader, document.body.firstChild);
        } else {
          document.documentElement.appendChild(preloader);
        }
      }

      var defaultLines = [
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span>'
      ];

      function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderBrandHeader(titleStr, secondaryStr) {
        var titleEl = document.getElementById('hud-brand-title');
        var subEl = document.getElementById('hud-brand-sub');

        var rawTitle = (titleStr || 'SONARLINE / lab').trim();
        if (titleEl) {
          if (rawTitle.indexOf('/') !== -1) {
            var parts = rawTitle.split('/');
            var first = parts[0].trim();
            var second = parts.slice(1).join('/').trim();
            titleEl.innerHTML = '<span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important; text-transform: uppercase !important;">' + escapeHtml(first) + '</span> ' +
              '<span class="hud-slash" style="color: #FF2A2A !important; margin: 0 4px !important; font-weight: 700 !important;">/</span> ' +
              '<span class="hud-title-second" style="color: #FF2A2A !important; font-weight: 400 !important; text-transform: uppercase !important;">' + escapeHtml(second) + '</span>';
          } else {
            titleEl.innerHTML = '<span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important; text-transform: uppercase !important;">' + escapeHtml(rawTitle) + '</span>';
          }
        }

        var rawSub = (secondaryStr || 'SOUND DESIGN LAB').trim();
        if (subEl) {
          subEl.textContent = rawSub;
        }
      }

      function formatCustomLine(rawText, isLast) {
        var s = rawText.trim();
        s = s.replace(/^(?:&gt;|>)\s*/, '');
        var okMatch = s.match(/(.*?)\s*\[\s*ok\s*\]/i);
        if (okMatch) {
          var cmd = okMatch[1].replace(/\.+$/, '').trim();
          return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(cmd) + '</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>';
        }
        if (isLast || /ready/i.test(s)) {
          var readyMatch = s.match(/^(.*?(?:ready\.?|welcome\.?))\s*(.*)$/i);
          if (readyMatch && readyMatch[1] && readyMatch[2]) {
            return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(readyMatch[1]) + '</span> <span class="hud-welcome">' + escapeHtml(readyMatch[2]) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
          }
          return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
        }
        return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
      }

      function scanForPreloaderConfig() {
        var root = document.body || document.documentElement;
        var config = {
          title: null,
          secondary: null,
          lines: null
        };
        if (!root) return config;

        var titleRe = /\[\[loader-title:\s*([\s\S]*?)\]\]/i;
        var secondaryRe = /\[\[loader-secondary:\s*([\s\S]*?)\]\]/i;
        var linesRe = /\[\[preloader:\s*([\s\S]*?)\]\]/i;

        var titleGlobalRe = /\[\[loader-title:\s*[\s\S]*?\]\]/gi;
        var secondaryGlobalRe = /\[\[loader-secondary:\s*[\s\S]*?\]\]/gi;
        var linesGlobalRe = /\[\[preloader:\s*[\s\S]*?\]\]/gi;

        // 1. Target sections and containers containing [[preloader:
        var candidateElements = root.querySelectorAll(
          '#content-section-ZGXLnKKrGq, [data-section-unique-id="content-section-ZGXLnKKrGq"], [data-section-key="text-simple"], [data-section-key="rich-text"], .richtext, .rich-text, .section-wrapper'
        );
        for (var r = 0; r < candidateElements.length; r++) {
          var cand = candidateElements[r];
          if (!cand || cand.id === 'sonarline-hud-preloader' || cand.id === 'sonarline-preloader' ||
              cand.closest('#sonarline-hud-preloader, #sonarline-preloader')) {
            continue;
          }

          var rawHtml = cand.innerHTML || '';
          var candText = cand.textContent || '';
          var candInner = cand.innerText || '';

          if (candText.indexOf('[[preloader:') !== -1 || rawHtml.indexOf('[[preloader:') !== -1 || candInner.indexOf('[[preloader:') !== -1) {
            var normalizedText = rawHtml
              .replace(/<br\s*\/?>/gi, '\n')
              .replace(/<\/(?:p|div|li)>\s*<(?:p|div|li)[^>]*>/gi, '\n')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&#160;/g, ' ');

            if (!config.lines) {
              var lm = normalizedText.match(linesRe) || candInner.match(linesRe) || candText.match(linesRe);
              if (lm && lm[1]) {
                var rawLines = lm[1].split(/\r?\n|\|/);
                var parsed = [];
                for (var l = 0; l < rawLines.length; l++) {
                  var line = rawLines[l].trim();
                  if (line.length > 0) parsed.push(line);
                }
                if (parsed.length > 0) config.lines = parsed;
              }
            }

            if (!config.title && (candText.indexOf('[[loader-title:') !== -1 || rawHtml.indexOf('[[loader-title:') !== -1)) {
              var tm = normalizedText.match(titleRe) || candInner.match(titleRe) || candText.match(titleRe);
              if (tm && tm[1]) config.title = tm[1].trim();
            }
            if (!config.secondary && (candText.indexOf('[[loader-secondary:') !== -1 || rawHtml.indexOf('[[loader-secondary:') !== -1)) {
              var sm = normalizedText.match(secondaryRe) || candInner.match(secondaryRe) || candText.match(secondaryRe);
              if (sm && sm[1]) config.secondary = sm[1].trim();
            }

            var sec = cand.closest('[data-section-key="text-simple"], [data-section-key="rich-text"], #content-section-ZGXLnKKrGq, .section-wrapper');
            if (!sec) sec = cand;

            if (sec !== document.body && sec !== document.documentElement && !sec.classList.contains('content-main-wrapper')) {
              sec.style.setProperty('display', 'none', 'important');
              sec.style.setProperty('visibility', 'hidden', 'important');
              sec.style.setProperty('height', '0px', 'important');
              sec.style.setProperty('min-height', '0px', 'important');
              sec.style.setProperty('max-height', '0px', 'important');
              sec.style.setProperty('margin', '0px', 'important');
              sec.style.setProperty('padding', '0px', 'important');
              sec.style.setProperty('padding-top', '0px', 'important');
              sec.style.setProperty('padding-bottom', '0px', 'important');
              sec.style.setProperty('opacity', '0', 'important');
              sec.style.setProperty('pointer-events', 'none', 'important');
              sec.setAttribute('data-preloader-hidden', 'true');
              sec.innerHTML = '';
            }
            cand.style.setProperty('display', 'none', 'important');
            cand.setAttribute('data-preloader-hidden', 'true');
            cand.innerHTML = '';
          }
        }

        // 2. Walk text nodes to safely extract and replace tokens without touching surrounding layout/containers
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var textNode;
        while ((textNode = walker.nextNode())) {
          if (!textNode.parentElement) continue;
          if (textNode.parentElement.id === 'sonarline-hud-preloader' || textNode.parentElement.id === 'sonarline-preloader' ||
              textNode.parentElement.closest('#sonarline-hud-preloader, #sonarline-preloader')) {
            continue;
          }
          var parentTag = textNode.parentElement.tagName;
          if (parentTag === 'SCRIPT' || parentTag === 'STYLE' || parentTag === 'NOSCRIPT') continue;

          var val = textNode.nodeValue || '';
          if (!val) continue;

          if (titleRe.test(val)) {
            if (!config.title) {
              var tm2 = val.match(titleRe);
              if (tm2 && tm2[1]) config.title = tm2[1].trim();
            }
            textNode.textContent = textNode.textContent.replace(titleGlobalRe, '');
            val = textNode.nodeValue || '';
          }

          if (secondaryRe.test(val)) {
            if (!config.secondary) {
              var sm2 = val.match(secondaryRe);
              if (sm2 && sm2[1]) config.secondary = sm2[1].trim();
            }
            textNode.textContent = textNode.textContent.replace(secondaryGlobalRe, '');
            val = textNode.nodeValue || '';
          }

          if (linesRe.test(val)) {
            if (!config.lines) {
              var lm2 = val.match(linesRe);
              if (lm2 && lm2[1]) {
                var rawLines2 = lm2[1].split(/\r?\n|\|/);
                var parsed2 = [];
                for (var k = 0; k < rawLines2.length; k++) {
                  var line2 = rawLines2[k].trim();
                  if (line2.length > 0) parsed2.push(line2);
                }
                if (parsed2.length > 0) config.lines = parsed2;
              }
            }
            textNode.textContent = textNode.textContent.replace(linesGlobalRe, '');
            var containingSec = textNode.parentElement.closest('[data-section-key="text-simple"], [data-section-key="rich-text"], #content-section-ZGXLnKKrGq, .section-wrapper, .richtext, .rich-text');
            if (containingSec && containingSec !== document.body && containingSec !== document.documentElement && !containingSec.classList.contains('content-main-wrapper')) {
              containingSec.style.setProperty('display', 'none', 'important');
              containingSec.style.setProperty('visibility', 'hidden', 'important');
              containingSec.style.setProperty('height', '0px', 'important');
              containingSec.style.setProperty('padding', '0px', 'important');
              containingSec.style.setProperty('margin', '0px', 'important');
              containingSec.setAttribute('data-preloader-hidden', 'true');
              containingSec.innerHTML = '';
            }
          }
        }

        return config;
      }

      function startSequence(config) {
        try {
          if (isDismissed) return;
          config = config || {};
          renderBrandHeader(config.title, config.secondary);

          var pEl = preloader || document.getElementById('sonarline-hud-preloader') || document.getElementById('sonarline-preloader');
          var readoutEl = pEl ? pEl.querySelector('.hud-terminal-readout') : document.querySelector('#sonarline-hud-preloader .hud-terminal-readout, #sonarline-preloader .hud-terminal-readout');
          var pctEl = document.getElementById('hud-progress-pct') || (pEl ? pEl.querySelector('.hud-progress-pct') : null);
          var fillEl = document.getElementById('hud-progress-fill') || (pEl ? pEl.querySelector('.hud-progress-fill') : null);
          
          if (!fillEl && pEl) {
            var lineEl = pEl.querySelector('.hud-progress-line');
            if (lineEl) {
              fillEl = document.createElement('div');
              fillEl.className = 'hud-progress-fill';
              fillEl.id = 'hud-progress-fill';
              lineEl.appendChild(fillEl);
            }
          }

          var customLines = config.lines;
          var htmlLines = [];
          if (customLines && customLines.length > 0) {
            for (var c = 0; c < customLines.length; c++) {
              htmlLines.push(formatCustomLine(customLines[c], c === customLines.length - 1));
            }
          } else {
            htmlLines = defaultLines.slice();
          }

          var total = htmlLines.length;
          if (readoutEl) {
            var linesHtml = '';
            for (var h = 0; h < total; h++) {
              linesHtml += '<div class="hud-line" id="hud-line-' + h + '">' + htmlLines[h] + '</div>';
            }
            readoutEl.innerHTML = linesHtml;
          }

          var domLines = [];
          for (var d = 0; d < total; d++) {
            domLines.push(document.getElementById('hud-line-' + d));
          }

          // Precalculate ascending random incremental percentages
          var currentProgress = 0;
          var stepPcts = [];
          for (var s = 0; s < total; s++) {
            if (s === total - 1) {
              stepPcts.push(100);
            } else {
              currentProgress += Math.floor(Math.random() * 20) + 10;
              if (currentProgress > 95) currentProgress = 95;
              if (s > 0 && currentProgress <= stepPcts[s - 1]) {
                currentProgress = Math.min(stepPcts[s - 1] + Math.floor(Math.random() * 5) + 1, 95);
              }
              stepPcts.push(currentProgress);
            }
          }

          var totalDuration = 1200;
          for (var idx = 0; idx < total; idx++) {
            (function(stepIdx) {
              var delay = (total <= 1) ? 100 : Math.round(100 + stepIdx * (totalDuration / (total - 1)));
              var pct = stepPcts[stepIdx];
              setTimeout(function() {
                try {
                  if (isDismissed) return;
                  if (domLines[stepIdx]) domLines[stepIdx].classList.add('active');
                  if (pctEl) pctEl.textContent = pct + '%';
                  if (fillEl) fillEl.style.setProperty('width', pct + '%', 'important');

                  // When final sequence completes at 100%, hold for 100ms, then smoothly fade out and unmount
                  if (stepIdx === total - 1) {
                    setTimeout(function() {
                      try {
                        if (isDismissed) return;
                        var ov = document.getElementById('sonarline-hud-preloader') || document.getElementById('sonarline-preloader') || preloader;
                        if (ov) {
                          ov.style.opacity = '0';
                          ov.style.pointerEvents = 'none';
                        }
                        setTimeout(function() {
                          dismissPreloader();
                          if (failsafeTimer) clearTimeout(failsafeTimer);
                        }, 250);
                      } catch (fadeErr) {
                        console.error('Preloader fade error:', fadeErr);
                        dismissPreloader();
                      }
                    }, 100);
                  }
                } catch (stepErr) {
                  console.error('Preloader step error:', stepErr);
                  dismissPreloader();
                }
              }, delay);
            })(idx);
          }
        } catch (seqErr) {
          console.error('Preloader startSequence error:', seqErr);
          dismissPreloader();
        }
      }

      var config = scanForPreloaderConfig();
      if (config.lines || config.title || config.secondary) {
        startSequence(config);
      } else if (document.readyState === 'loading') {
        var started = false;
        var onReady = function() {
          try {
            if (started || isDismissed) return;
            started = true;
            document.removeEventListener('DOMContentLoaded', onReady);
            var found = scanForPreloaderConfig();
            startSequence(found);
          } catch (onReadyErr) {
            console.error('Preloader onReady exception:', onReadyErr);
            dismissPreloader();
          }
        };
        document.addEventListener('DOMContentLoaded', onReady);
        setTimeout(function() {
          try {
            if (!started && !isDismissed) {
              started = true;
              var found = scanForPreloaderConfig();
              startSequence(found);
            }
          } catch (timeoutErr) {
            console.error('Preloader timeout exception:', timeoutErr);
            dismissPreloader();
          }
        }, 300);
      } else {
        startSequence({});
      }
    } catch (lifecycleErr) {
      console.error('Preloader lifecycle exception:', lifecycleErr);
      dismissPreloader();
    }
  })();
</script>

<!-- Top Red Scroll Indicator (Storewide) - Fluid Sub-pixel ScaleX with requestAnimationFrame -->
<style>
  #sonarline-scroll-progress {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 2px !important;
    background: #FF2A2A !important;
    z-index: 2147483647 !important;
    transform-origin: 0 0 !important;
    transform: scaleX(0);
    will-change: transform !important;
    pointer-events: none !important;
    transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1) !important;
  }
</style>
<script>
  (function() {
    var ticking = false;
    var bar = null;

    function getBar() {
      if (!bar) {
        bar = document.getElementById('sonarline-scroll-progress');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'sonarline-scroll-progress';
          if (document.body) {
            document.body.appendChild(bar);
          } else {
            document.documentElement.appendChild(bar);
          }
        }
      }
      return bar;
    }

    function updateProgress() {
      var progressBar = getBar();
      var scrollEl = document.scrollingElement || document.documentElement || document.body;
      var winScroll = window.scrollY || window.pageYOffset || scrollEl.scrollTop || 0;
      var maxScroll = Math.max(scrollEl.scrollHeight, document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;
      var ratio = maxScroll > 0 ? Math.min(Math.max(winScroll / maxScroll, 0), 1) : 0;
      if (progressBar) {
        progressBar.style.setProperty('transform', 'scaleX(' + ratio + ')', 'important');
      }
      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        window.requestAnimationFrame(updateProgress);
        ticking = true;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        getBar();
        requestTick();
      });
    } else {
      getBar();
      requestTick();
    }
    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick, { passive: true });
  })();

    // Brutalist Product & Backblaze Audio Preview Modal Engine
    var modalHtml =

    var audioEngine = new Audio();
    var allCards = [];
    var currentCardIndex = -1;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      var m = Math.floor(seconds / 60);
      var s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function stopAudio() {
      try {
        audioEngine.pause();
        audioEngine.currentTime = 0;
        audioEngine.removeAttribute('src');
      } catch (e) {}
      var playBtn = document.querySelector('.sonarline-audio-play-btn');
      if (playBtn) {
        var icon = playBtn.querySelector('.sonarline-audio-icon');
        var text = playBtn.querySelector('.sonarline-audio-btn-text');
        if (icon) icon.innerHTML = '&#9654;';
        if (text) text.textContent = 'PLAY DEMO';
        playBtn.classList.remove('is-playing');
      }
      var progress = document.querySelector('.sonarline-audio-track-progress');
      if (progress) progress.style.width = '0%';
      var scrubber = document.querySelector('.sonarline-audio-scrubber');
      if (scrubber) scrubber.value = 0;
      var timeEl = document.querySelector('.sonarline-audio-time');
      if (timeEl) timeEl.textContent = '0:00 / 0:00';
      var allQuickPlays = document.querySelectorAll('.sonarline-card-quickplay');
      for (var q = 0; q < allQuickPlays.length; q++) {
        allQuickPlays[q].classList.remove('is-playing');
        allQuickPlays[q].innerHTML = '&#9654;';
      }
    }

    function ensureModal() {
      var modal = document.getElementById('sonarline-product-modal');
      if (!modal) {
        var wrapper = document.createElement('div');
        wrapper.innerHTML = modalHtml;
        modal = wrapper.firstElementChild;
        (document.body || document.documentElement).appendChild(modal);

        var closeBtn = modal.querySelector('.sonarline-modal-close');
        var backdrop = modal.querySelector('.sonarline-modal-backdrop');
        var prevBtn = modal.querySelector('.sonarline-modal-prev');
        var nextBtn = modal.querySelector('.sonarline-modal-next');
        var playBtn = modal.querySelector('.sonarline-audio-play-btn');
        var scrubber = modal.querySelector('.sonarline-audio-scrubber');
        var volumeInput = modal.querySelector('.sonarline-audio-volume');
        var progress = modal.querySelector('.sonarline-audio-track-progress');
        var timeEl = modal.querySelector('.sonarline-audio-time');
        var waveformWrap = modal.querySelector('.sonarline-waveform-wrap');
        var waveformCanvas = modal.querySelector('.sonarline-waveform-canvas');
        var wfCtx = waveformCanvas ? waveformCanvas.getContext('2d') : null;
        var wfAnimId = null;

        // Volume Persistence
        try {
          var savedVol = localStorage.getItem('sonarline_audio_vol');
          if (savedVol !== null) {
            var v = parseFloat(savedVol);
            if (!isNaN(v) && v >= 0 && v <= 1) {
              audioEngine.volume = v;
              if (volumeInput) volumeInput.value = String(v);
            }
          }
        } catch (e) {}

        function drawWaveform() {
          if (!waveformCanvas || !wfCtx) return;
          var w = waveformCanvas.width = waveformCanvas.clientWidth || 400;
          var h = waveformCanvas.height = waveformCanvas.clientHeight || 38;
          wfCtx.clearRect(0, 0, w, h);

          var barCount = 44;
          var barW = (w / barCount) * 0.65;
          var gap = (w - (barCount * barW)) / (barCount - 1);
          var progressRatio = (audioEngine.duration && audioEngine.duration > 0) ? (audioEngine.currentTime / audioEngine.duration) : 0;
          var isPlaying = !audioEngine.paused;
          var now = Date.now() * 0.006;

          for (var b = 0; b < barCount; b++) {
            var barRatio = b / barCount;
            var baseH = Math.sin(b * 0.28) * 0.35 + 0.52;
            var dynamicScale = isPlaying ? (Math.sin(now + b * 0.45) * 0.35 + 0.65) : 0.4;
            var curBarH = Math.max(3, h * baseH * dynamicScale);
            var x = b * (barW + gap);
            var y = (h - curBarH) / 2;

            if (barRatio <= progressRatio) {
              wfCtx.fillStyle = '#FF3B30';
            } else {
              wfCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            }
            wfCtx.fillRect(x, y, barW, curBarH);
          }

          if (!audioEngine.paused) {
            wfAnimId = window.requestAnimationFrame(drawWaveform);
          }
        }

          waveformWrap.addEventListener('click', function(e) {
            if (!audioEngine.duration) return;
            var rect = waveformWrap.getBoundingClientRect();
            var clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            var seekRatio = clickX / rect.width;
            audioEngine.currentTime = seekRatio * audioEngine.duration;

            e.preventDefault();

            e.preventDefault();

            try { localStorage.setItem('sonarline_audio_vol', String(audioEngine.volume)); } catch (err) {}
          }

          stopAudio();
          drawWaveform();

    function closeModal() {

    function populateModal(card) {
      if (!card) return;
      var modal = ensureModal();

      allCards = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper, .product-card'));
      currentCardIndex = allCards.indexOf(card);

      // 1. Artwork
      var imgEl = card.querySelector('img');
      var modalImg = modal.querySelector('.sonarline-modal-img');
      if (modalImg) {

      var modalPrice = modal.querySelector('.sonarline-modal-price');

      // 5. Description
      var descEl = card.querySelector('.card__description, .product-description, .font-section-collection-productDesc, p:not(.price)');
      var descText = descEl ? descEl.textContent.replace(/\[\[tag:\s*[\s\S]*?\]\]/gi, '').replace(/\[\[audio:\s*[\s\S]*?\]\]/gi, '').trim() : '';
      var modalDesc = modal.querySelector('.sonarline-modal-desc');

      if (audioPlayer) {
        if (audioSrc) {
          audioPlayer.style.setProperty('display', 'flex', 'important');
          audioEngine.src = audioSrc;
          audioEngine.load();
        } else {
          audioPlayer.style.setProperty('display', 'none', 'important');
        }
      }

      // 8. Nav arrows visibility
      var prevBtn = modal.querySelector('.sonarline-modal-prev');
      var nextBtn = modal.querySelector('.sonarline-modal-next');
      if (prevBtn) prevBtn.style.setProperty('display', allCards.length > 1 ? 'flex' : 'none', 'important');
      if (nextBtn) nextBtn.style.setProperty('display', allCards.length > 1 ? 'flex' : 'none', 'important');

      modal.style.setProperty('display', 'flex', 'important');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('sonarline-modal-open');
    }

    window.openProductModal = populateModal;
    window.closeProductModal = closeModal;

    // Homepage Cards Shortcode Sync (Issue 2): fetch product pages in background,
    // parse [[tag:]] / [[audio:]] from product HTML, cache in sessionStorage.
    // Same-origin only, limited concurrency, fail silently.
    var sonarlineSyncQueue = [];
    var sonarlineSyncActive = 0;
    var SONARLINE_SYNC_MAX = 3;

    function sonarlineCacheKey(url) {
      try {
        var u = new URL(url, window.location.origin);
        return 'sonarline_prod_' + u.pathname.replace(/[^a-zA-Z0-9_-]+/g, '_');
      } catch (e) {
        return 'sonarline_prod_' + String(url).replace(/[^a-zA-Z0-9_-]+/g, '_').slice(0, 80);
      }
    }

    function sonarlineParseShortcodes(htmlText) {
      var out = { tag: '', audio: '' };
      if (!htmlText) return out;
      try {
        var t = htmlText.match(/\[\[tag:\s*([\s\S]*?)\]\]/i);
        if (t) out.tag = (t[1] || '').trim();
        var a = htmlText.match(/\[\[audio:\s*([\s\S]*?)\]\]/i);
        if (a) out.audio = (a[1] || '').trim();
      } catch (e) {}
      return out;
    }

    function sonarlineApplySyncedShortcodes(card, data) {
      try {
        if (!card || !card.isConnected) return;
        if (data.audio && !card.getAttribute('data-audio-src')) {
          card.setAttribute('data-audio-src', data.audio);
        }
        if (data.tag) {
          var pill = card.querySelector('.sonarline-card-tag-pill');
          if (pill && !pill.textContent.trim()) {
            pill.textContent = data.tag;
            pill.style.setProperty('display', 'inline-flex', 'important');
          }
        }
      } catch (e) {}
    }

    function sonarlinePumpSyncQueue() {
      if (sonarlineSyncActive >= SONARLINE_SYNC_MAX) return;
      var job = sonarlineSyncQueue.shift();
      if (!job) return;
      sonarlineSyncActive++;
      fetch(job.url, { credentials: 'same-origin' }).then(function(res) {
        if (!res.ok) throw new Error('bad status ' + res.status);
        return res.text();
      }).then(function(html) {
        var parsed = sonarlineParseShortcodes(html);
        try {
          sessionStorage.setItem(job.key, JSON.stringify(parsed));
        } catch (e) {}
        sonarlineApplySyncedShortcodes(job.card, parsed);
      }).catch(function() {}).then(function() {
        sonarlineSyncActive--;
        sonarlinePumpSyncQueue();
      });
    }

    function sonarlineSyncCardShortcodes(card) {
      try {
        var link = card.querySelector('a[href*="/b/"], a[href*="/p/"], a[href*="/product"]');
        if (!link || !link.href) return;
        var u = new URL(link.href, window.location.origin);
        if (u.origin !== window.location.origin) return;
        if (u.pathname.indexOf('/b/') === -1 && u.pathname.indexOf('/p/') === -1) return;
        var key = sonarlineCacheKey(u.href);
        var cached = null;
        try {
          cached = sessionStorage.getItem(key);
        } catch (e) {}
        if (cached) {
          try {
            sonarlineApplySyncedShortcodes(card, JSON.parse(cached));
          } catch (e) {}
          return;
        }
        if (card.getAttribute('data-sonarline-sync') === 'queued') return;
        card.setAttribute('data-sonarline-sync', 'queued');
        sonarlineSyncQueue.push({ url: u.href, key: key, card: card });
        sonarlinePumpSyncQueue();
      } catch (e) {}
    }

    // Product pages (Issue 3): strip raw [[tag:]] / [[audio:]] tokens from
    // .product-description so CMS shortcodes never render as plain text.
    function sonarlineScrubProductDescriptions() {
      try {
        var descs = document.querySelectorAll('.product-description');
        for (var d = 0; d < descs.length; d++) {
          var walker = document.createTreeWalker(descs[d], NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && /\[\[(tag|audio):/i.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(/\[\[tag:\s*[\s\S]*?\]\]/gi, '').replace(/\[\[audio:\s*[\s\S]*?\]\]/gi, '').trim();
            }
          }
        }
      } catch (e) {}
    }

    function cleanProductCards() {
      var cards = document.querySelectorAll('.card-wrapper, .product-card');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];

        // 1. Hide duplicate inner content inside card__inner
        var innerContent = card.querySelectorAll('.card__inner .card__content, .card__inner .card__information');
        for (var j = 0; j < innerContent.length; j++) {
          innerContent[j].style.setProperty('display', 'none', 'important');
          innerContent[j].style.setProperty('visibility', 'hidden', 'important');
          innerContent[j].style.setProperty('height', '0', 'important');
          innerContent[j].style.setProperty('overflow', 'hidden', 'important');
        }

        // 2. Fix card__inner: use padding-bottom:100% + height:0 ratio pattern
        var cardInner = card.querySelector('.card__inner');
        if (cardInner) {
          cardInner.style.setProperty('position', 'relative', 'important');
          cardInner.style.setProperty('overflow', 'hidden', 'important');
          cardInner.style.setProperty('display', 'block', 'important');
          cardInner.style.setProperty('width', '100%', 'important');
          cardInner.style.setProperty('height', '0', 'important');
          cardInner.style.setProperty('padding-top', '0', 'important');
          cardInner.style.setProperty('padding-bottom', '100%', 'important');
          cardInner.style.setProperty('box-sizing', 'content-box', 'important');
          cardInner.style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 3. Fix card__media: force absolute positioning
        var cardMedias = card.querySelectorAll('.card__media, .media');
        for (var k = 0; k < cardMedias.length; k++) {
          fixCardMedia(cardMedias[k]);
          cardMedias[k].style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 4. Fix all images inside cards: force position and top:0
        var imgs = card.querySelectorAll('img');
        for (var m = 0; m < imgs.length; m++) {
          fixCardImage(imgs[m]);
          imgs[m].style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 5. Two-Row Metadata Layout, [[tag: ...]] & [[audio: ...]] Shortcode Engine
        var content = card.querySelector('.card > .card__content, .card__content:not(.card__inner *)');
        if (content) {
          var titleEl = content.querySelector('.card__heading, .font-section-collection-productName, h3, h4, .product-title, .product-name');
          var tagText = '';

          // Parse [[audio: URL_HERE]] shortcode from card
          var audioUrl = '';
          var cardRawText = card.textContent || '';
          var audioMatch = cardRawText.match(/\[\[audio:\s*([\s\S]*?)\]\]/i);
          if (audioMatch) {
            audioUrl = audioMatch[1].trim();
            card.setAttribute('data-audio-src', audioUrl);
            var aWalker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
            var aNode;
            while ((aNode = aWalker.nextNode())) {
              if (aNode.nodeValue && /\[\[audio:/i.test(aNode.nodeValue)) {
                aNode.nodeValue = aNode.nodeValue.replace(/\[\[audio:\s*[\s\S]*?\]\]/gi, '').trim();
              }
            }
          }

          // Check title for [[tag: ...]]
          if (titleEl) {
            var rawTitle = titleEl.textContent || titleEl.innerText || '';
            var tagMatch = rawTitle.match(/\[\[tag:\s*([\s\S]*?)\]\]/i);
            if (tagMatch) {
              tagText = tagMatch[1].trim();
              // Strip [[tag: ...]] completely from title text and links
              var links = titleEl.querySelectorAll('a');
              if (links.length > 0) {
                for (var l = 0; l < links.length; l++) {
                  links[l].textContent = (links[l].textContent || '').replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
                }
              }
              titleEl.textContent = (titleEl.textContent || '').replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
            }
          }

          // Check card for [[tag: ...]] if not in title
          if (!tagText) {
            var cardRaw = card.textContent || '';
            var tagMatch2 = cardRaw.match(/\[\[tag:\s*([\s\S]*?)\]\]/i);
            if (tagMatch2) {
              tagText = tagMatch2[1].trim();
              var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
              var tn;
              while ((tn = walker.nextNode())) {
                if (tn.nodeValue && tn.nodeValue.includes('[[tag:')) {
                  tn.nodeValue = tn.nodeValue.replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
                }
              }
            }
          }

          // Build or update two-row metadata container
          var metaWrap = content.querySelector('.sonarline-card-metadata');
          if (!metaWrap) {
            metaWrap = document.createElement('div');
            metaWrap.className = 'sonarline-card-metadata';
            metaWrap.innerHTML = 
              '<div class="sonarline-card-row-top">' +
                '<div class="sonarline-card-title-wrap"></div>' +
                '<div class="sonarline-card-info-badge" title="Product Preview">!</div>' +
              '</div>' +
              '<div class="sonarline-card-row-bottom">' +
                '<div class="sonarline-card-tag-pill"></div>' +
                '<div class="sonarline-card-price-wrap"></div>' +
              '</div>';
            content.appendChild(metaWrap);
          }

          // Circular exclamation badge with interactive modal trigger
          var badgeEl = metaWrap.querySelector('.sonarline-card-info-badge');
          if (badgeEl) {
            if (badgeEl.textContent !== '!') badgeEl.textContent = '!';
            badgeEl.title = 'Product Preview';
            if (!badgeEl.getAttribute('data-modal-bound')) {
              badgeEl.setAttribute('data-modal-bound', 'true');
              (function(currentCard) {
                badgeEl.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  populateModal(currentCard);
                });
              })(card);
            }
          }

          // Place title in row 1
          var titleWrap = metaWrap.querySelector('.sonarline-card-title-wrap');
          if (titleEl && titleEl.parentElement !== titleWrap) {
            titleWrap.appendChild(titleEl);
          }

          // Update pill in row 2 (Strictly conditional, ZERO fallback/inferred tags)
          var pillEl = metaWrap.querySelector('.sonarline-card-tag-pill');
          if (pillEl) {
            if (tagText) {
              pillEl.textContent = tagText;
              pillEl.style.setProperty('display', 'inline-flex', 'important');
            } else {
              pillEl.textContent = '';
              pillEl.style.setProperty('display', 'none', 'important');
            }
          }

          // Place price in row 2
          var priceEl = content.querySelector('.price-block, .price, [class*="price"]:not(.sonarline-card-price-wrap):not(.sonarline-card-row-bottom)');
          var priceWrap = metaWrap.querySelector('.sonarline-card-price-wrap');
          if (priceEl && priceEl.parentElement !== priceWrap && priceEl !== priceWrap) {
            priceWrap.appendChild(priceEl);
          }

          // Card Quick-Listen Button
          var cardInner = card.querySelector('.card__inner');
          var cardAudio = card.getAttribute('data-audio-src') || audioUrl;
          if (cardInner && cardAudio) {
            var quickPlay = cardInner.querySelector('.sonarline-card-quickplay');
            if (!quickPlay) {
              quickPlay = document.createElement('button');
              quickPlay.type = 'button';
              quickPlay.className = 'sonarline-card-quickplay';
              quickPlay.setAttribute('aria-label', 'Quick listen preview');
              quickPlay.innerHTML = '&#9654;';
              cardInner.appendChild(quickPlay);

              (function(src, btn) {
                btn.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();

                  var allQuickPlays = document.querySelectorAll('.sonarline-card-quickplay');
                  if (audioEngine.src === src && !audioEngine.paused) {
                    stopAudio();
                    btn.classList.remove('is-playing');
                    btn.innerHTML = '&#9654;';
                  } else {
                    for (var q = 0; q < allQuickPlays.length; q++) {
                      allQuickPlays[q].classList.remove('is-playing');
                      allQuickPlays[q].innerHTML = '&#9654;';
                    }
                    audioEngine.src = src;
                    audioEngine.play().then(function() {
                      btn.classList.add('is-playing');
                      btn.innerHTML = '&#10074;&#10074;';
                    }).catch(function(err) {
                      console.error('Quick play error:', err);
                    });
                  }
                });
              })(cardAudio, quickPlay);
            }
          }

          // Text Scramble Decryption Effect on Card Title Hover
          if (titleEl && !titleEl.getAttribute('data-scramble-bound')) {
            titleEl.setAttribute('data-scramble-bound', 'true');
            titleEl.addEventListener('mouseenter', function() {
              var targetLink = titleEl.querySelector('a') || titleEl;
              var originalText = targetLink.getAttribute('data-original-title') || targetLink.textContent.trim();
              if (!targetLink.getAttribute('data-original-title')) {
                targetLink.setAttribute('data-original-title', originalText);
              }
              if (targetLink.getAttribute('data-scrambling') === 'true') return;
              targetLink.setAttribute('data-scrambling', 'true');

              var chars = '01#%*!&_/-[]<>';
              var length = originalText.length;
              var step = 0;
              var maxSteps = 10;
              var interval = setInterval(function() {
                step++;
                var scrambled = '';
                for (var s = 0; s < length; s++) {
                  if (originalText[s] === ' ') {
                    scrambled += ' ';
                  } else if (s < (step / maxSteps) * length) {
                    scrambled += originalText[s];
                  } else {
                    scrambled += chars[Math.floor(Math.random() * chars.length)];
                  }
                }
                targetLink.textContent = scrambled;
                if (step >= maxSteps) {
                  clearInterval(interval);
                  targetLink.textContent = originalText;
                  targetLink.removeAttribute('data-scrambling');
                }
              }, 25);
            });
          }

          // Background sync: fill missing tag/audio from product page + scrub handled globally
          var needsSync = (!tagText || !audioUrl);
          if (needsSync) {
            try { sonarlineSyncCardShortcodes(card); } catch (e) {}
          }
        }
      }
      try { sonarlineScrubProductDescriptions(); } catch (e) {}
      try { initCategoryFilter(); } catch (e) {}
    }

    // Product Category Filter Bar Engine
    function initCategoryFilter() {
      var section = document.querySelector('#page-section-collection, [data-section-key="collection"]');
      if (!section) return;
      var existingHud = section.querySelector('.sonarline-filter-hud');
      var cards = section.querySelectorAll('.card-wrapper:not([data-sl-clone]), .product-card:not([data-sl-clone])');
      if (cards.length === 0) return;

      var tagCounts = {};
      var total = 0;
      for (var i = 0; i < cards.length; i++) {
        var pill = cards[i].querySelector('.sonarline-card-tag-pill');
        var tag = (pill && pill.textContent.trim() && pill.style.display !== 'none') ? pill.textContent.trim() : '';
        if (tag) {
          tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        }
        total++;
      }

      var tags = Object.keys(tagCounts);
      if (tags.length === 0) return;

      if (!existingHud) {
        existingHud = document.createElement('div');
        existingHud.className = 'sonarline-filter-hud';
        var anchor = section.querySelector('.product-list-block, .grid-block, .sl-rail-viewport') || section.firstElementChild;
        if (anchor && anchor.parentNode) {
          anchor.parentNode.insertBefore(existingHud, anchor);
        }
      }

      var activeTag = existingHud.getAttribute('data-active-filter') || 'ALL';
      var hudHtml = '<span class="sonarline-filter-label">ARCHIVE //</span>' +
        '<button type="button" class="sonarline-filter-pill' + (activeTag === 'ALL' ? ' active' : '') + '" data-filter-tag="ALL">ALL <span class="sonarline-filter-count">(' + total + ')</span></button>';

      for (var t = 0; t < tags.length; t++) {
        var tg = tags[t];
        hudHtml += '<button type="button" class="sonarline-filter-pill' + (activeTag === tg ? ' active' : '') + '" data-filter-tag="' + tg + '">' + tg + ' <span class="sonarline-filter-count">(' + tagCounts[tg] + ')</span></button>';
      }
      existingHud.innerHTML = hudHtml;

      var pills = existingHud.querySelectorAll('.sonarline-filter-pill');
      for (var p = 0; p < pills.length; p++) {
        pills[p].addEventListener('click', function(e) {
          e.preventDefault();
          var filterTag = this.getAttribute('data-filter-tag');
          existingHud.setAttribute('data-active-filter', filterTag);
          var allPills = existingHud.querySelectorAll('.sonarline-filter-pill');
          for (var ap = 0; ap < allPills.length; ap++) {
            allPills[ap].classList.toggle('active', allPills[ap] === this);
          }

          var allCards = document.querySelectorAll('.card-wrapper, .product-card');
          for (var c = 0; c < allCards.length; c++) {
            var cCard = allCards[c];
            if (filterTag === 'ALL') {
              cCard.classList.remove('is-filtered-out');
            } else {
              var cpill = cCard.querySelector('.sonarline-card-tag-pill');
              var ctag = (cpill && cpill.textContent.trim()) ? cpill.textContent.trim() : '';
              if (ctag === filterTag) {
                cCard.classList.remove('is-filtered-out');
              } else {
                cCard.classList.add('is-filtered-out');
              }
            }
          }
          if (typeof window.slRailInit === 'function') {
            window.slRailInit();
          }
        });
      }
    }

    // MutationObserver: re-apply when Payhip lazy loader adds/mutates cards.
    // Perf guards (lag fix): style mutations are NOT observed (our own
    // setProperty writes used to retrigger the observer in a feedback loop).
    // Only IMG src/class signals + added nodes trigger a 250ms-debounced pass,
    // and our own decorator nodes are always ignored.
    function startCardObserver() {
      var target = document.body || document.documentElement;
      var debounceTimer = null;
      var observer = new MutationObserver(function(mutations) {
        var needsClean = false;
        for (var i = 0; i < mutations.length; i++) {
          var mut = mutations[i];
          var tgt = mut.target;
          if (tgt && tgt.closest) {
            try {
              if (tgt.closest('.sonarline-card-metadata, #sonarline-product-modal, #sl-cursor-dot, #sl-cursor-circle, #sl-selection-box, #sonarline-scroll-progress')) continue;
            } catch (e) {}
          }
          if (mut.type === 'attributes') {
            if (tgt && (tgt.tagName === 'IMG' ||
                (tgt.classList && (tgt.classList.contains('card__media') || tgt.classList.contains('media'))))) {
              if (mut.attributeName === 'src' || mut.attributeName === 'class') {
                needsClean = true;
                break;
              }
            }
            continue;
          }
          if (mut.type === 'childList' && mut.addedNodes.length > 0) {
            needsClean = true;
            break;
          }
        }
        if (needsClean && !debounceTimer) {
          debounceTimer = setTimeout(function() {
            debounceTimer = null;
            window.requestAnimationFrame(cleanProductCards);
          }, 250);
        }
      });
      observer.observe(target, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['src', 'class']
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        cleanProductCards();
        startCardObserver();
      });
    } else {
      cleanProductCards();
      startCardObserver();
    }
    setTimeout(cleanProductCards, 100);
    setTimeout(cleanProductCards, 500);
    setTimeout(cleanProductCards, 1500);
    setTimeout(cleanProductCards, 3000);
  })();

      try {
        if (!root) return;
        var els = root.querySelectorAll('p, h1, h2, h3, h4, span, div, .heading-text, .hero-title, .richtext, .richtext p, [class*="text"], [class*="banner"]');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el.querySelector && el.querySelector('[data-shortcode-parsed]')) continue;
          if (el.getAttribute && el.getAttribute('data-shortcode-parsed')) continue;
          if (el.classList && (el.classList.contains('sonarline-terminal-prompt') || el.classList.contains('sonarline-status-pill'))) continue;

          var text = el.textContent || '';
          if (/(?:\[\[\s*badge\s*:|\{\{\s*terminal\s*:)/i.test(text)) {
            // Let deepest matching child handle it to avoid clobbering siblings
            var hasChildMatch = false;
            for (var c = 0; c < el.children.length; c++) {
              if (/(?:\[\[\s*badge\s*:|\{\{\s*terminal\s*:)/i.test(el.children[c].textContent || '')) {
                hasChildMatch = true;
                break;
              }
            }
            if (hasChildMatch) continue;

            var normalized = el.innerHTML.replace(/\u00a0|&nbsp;/gi, ' ');
            if (/(?:\[\[\s*badge\s*:|\{\{\s*terminal\s*:)/i.test(normalized)) {
              var newHtml = normalized.replace(/\[\[\s*badge\s*:\s*([\s\S]*?)\]\]/gi, function(match, content) {
                return buildBadgeHtml(content);
              }).replace(/\{\{\s*terminal\s*:\s*([\s\S]*?)\}\}/gi, function(match, content) {
                return buildTerminalHtml(content);
              });
              if (newHtml !== el.innerHTML) {
                el.innerHTML = newHtml;
              }
            } else {
              var cleanText = text.replace(/\u00a0|&nbsp;/gi, ' ');
              var termMatch = cleanText.match(/\{\{\s*terminal\s*:\s*([\s\S]*?)\}\}/i);
              var badgeMatch = cleanText.match(/\[\[\s*badge\s*:\s*([\s\S]*?)\]\]/i);
              if (termMatch) {
                el.innerHTML = buildTerminalHtml(termMatch[1]);
              } else if (badgeMatch) {
                el.innerHTML = buildBadgeHtml(badgeMatch[1]);
              }
            }
          }
        }
      } catch (e) {
        console.error('sweepUnparsedShortcodes error:', e);
      }
    }

    function runParser() {
      try {
        var root = document.body || document.documentElement;
        if (root) {
          parseShortcodesInNode(root);
          sweepUnparsedShortcodes(root);
        }
      } catch (err) {
        console.error('runParser error:', err);
      }
    }

    runParser();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runParser);
    }

    // Lag/freeze fix: NEVER sweep synchronously inside the observer callback.
    // Our own parse writes (innerHTML) used to retrigger the observer, and
    // every unrelated mutation (lazy-loader, clock tick, card fixes) caused a
    // full-body sweep. Now: ignore our own live regions, debounce 300ms,
    // disconnect while writing (breaks ping-pong), cap total sweeps.
    var observerSweepCount = 0;
    var observerTimer = null;
    var pendingShortcodeNodes = [];
    var OBSERVER_SWEEP_CAP = 25;

    function attachShortcodeObserver() {
      try {
        if (observerSweepCount >= OBSERVER_SWEEP_CAP) return;
        // Scope strictly to the content container — never the whole body —
        // so header/cursor/modal churn can't trigger page-wide rescans.
        var scope = document.querySelector('.content-main-wrapper') || document.body;
        if (scope) observer.observe(scope, { childList: true, subtree: true, characterData: true });
      } catch (e) {}
    }

    // Idle auto-disconnect: 3s after the last relevant batch, initial parsing
    // is done and no dynamic content is expected — release the observer.
    var shortcodeIdleTimer = null;
    function armShortcodeIdleDisconnect() {
      try {
        if (shortcodeIdleTimer) clearTimeout(shortcodeIdleTimer);
        shortcodeIdleTimer = setTimeout(function() {
          shortcodeIdleTimer = null;
          try { observer.disconnect(); } catch (e) {}
        }, 3000);
      } catch (e) {}
    }

    var observer = new MutationObserver(function(mutations) {
      try {
        var relevant = false;
        for (var m = 0; m < mutations.length; m++) {
          var mutation = mutations[m];
          if (mutation.type === 'childList') {
            for (var a = 0; a < mutation.addedNodes.length; a++) {
              var n = mutation.addedNodes[a];
              if (n && n.closest) {
                try {
                  if (n.closest('[data-shortcode-parsed], .sonarline-terminal-prompt, .sonarline-status-pill, .sonarline-status-clock, #sonarline-product-modal, #sonarline-preloader, #sonarline-hud-preloader')) continue;
                } catch (e) {}
              }
              pendingShortcodeNodes.push(n);
              relevant = true;
            }
          } else if (mutation.type === 'characterData') {
            var t = mutation.target;
            if (t && t.parentNode && t.parentNode.closest) {
              try {
                if (t.parentNode.closest('[data-shortcode-parsed], .sonarline-terminal-prompt, .sonarline-status-pill, .sonarline-status-clock')) continue;
              } catch (e) {}
            }
            pendingShortcodeNodes.push(t);
            relevant = true;
          }
        }
        if (!relevant) return;
        if (observerSweepCount >= OBSERVER_SWEEP_CAP) { observer.disconnect(); return; }
        if (observerTimer) return;
        observerTimer = setTimeout(function() {
          observerTimer = null;
          observer.disconnect();
          try {
            for (var p = 0; p < pendingShortcodeNodes.length; p++) {
              parseShortcodesInNode(pendingShortcodeNodes[p]);
            }
            pendingShortcodeNodes = [];
            sweepUnparsedShortcodes(document.body || document.documentElement);
            observerSweepCount++;
          } catch (e) {}
          attachShortcodeObserver();
          armShortcodeIdleDisconnect();
        }, 300);
      } catch (e) {
        console.error('Shortcode observer error:', e);
      }
    });

    if (document.body) {
      attachShortcodeObserver();
      armShortcodeIdleDisconnect();
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        attachShortcodeObserver();
        armShortcodeIdleDisconnect();
      });
    }

    // Live clock ticker for any parsed status pill clocks
    function updateClocks() {
      try {
        var clocks = document.querySelectorAll('.sonarline-status-clock, #sonarline-native-clock');
        if (clocks.length > 0) {
          var now = new Date();
          var timeStr = now.toTimeString().split(' ')[0];
          for (var c = 0; c < clocks.length; c++) {
            clocks[c].textContent = timeStr;
          }
        }
      } catch (e) {
        console.error('updateClocks error:', e);
      }
    }
    updateClocks();
    setInterval(updateClocks, 1000);
  })();

  // ==========================================================================
  // Subtask 3: Unified Hero Parallax & Scroll Blur Coordination
  // Synchronizes status badge, title, subtitle, and terminal prompt
  // ==========================================================================
  (function() {
    var ticking = false;
    // Cache hero nodes once: per-frame querySelectorAll + O(n^2) dedupe was
    // a scroll-jank source. Refresh only when the cached root disconnects.
    var cachedHeroEl = null;
    var cachedHeroElements = null;
    var lastPointerNone = false;
    function refreshHeroCache() {
      cachedHeroEl = document.querySelector(
        '[data-section-key="hero"], .section-hero, [data-section-key="headline"], #content-section-LBNmnP42zK, .hero, [data-section-type="hero"], .theme-tusk .banner, .theme-tusk .hero, .banner, .header-banner, .home-banner, .store-banner'
      );
      cachedHeroElements = null;
      lastPointerNone = false;
      if (!cachedHeroEl) return;
      var candidates = cachedHeroEl.querySelectorAll(
        '.sonarline-status-pill, h1, h2, .heading-text, .hero-title, .title, #sonarline-glitch-title, p, .richtext p, .category-list, .categories, .category-links, .category-link-wrapper, .categories-wrapper, [class*="category"], .sonarline-terminal-prompt'
      );
      cachedHeroElements = [];
      for (var c = 0; c < candidates.length; c++) {
        var cand = candidates[c];
        var isDescendant = false;
        for (var k = 0; k < candidates.length; k++) {
          if (k !== c && candidates[k].contains(cand)) {
            isDescendant = true;
            break;
          }
        }
        if (!isDescendant) {
          cachedHeroElements.push(cand);
        }
      }
      if (cachedHeroElements.length === 0) {
        var contents = cachedHeroEl.querySelector('.section-contents') || cachedHeroEl;
        cachedHeroElements.push(contents);
      }
    }
    function updateHeroParallax() {
      try {
        if (!cachedHeroEl || !cachedHeroEl.isConnected) refreshHeroCache();
        if (cachedHeroEl && cachedHeroElements) {
          // Single layout read per frame.
          var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          if (scrollY < 0) scrollY = 0;

          var fadeProgress = Math.min(scrollY / 450, 1);
          // Opacity falloff + subtle translate3d only. Dynamic Gaussian blur
          // on large containers forces a full-layer raster every frame, so it
          // is intentionally eliminated from the scroll path.
          var opacityVal = Math.max(1 - fadeProgress * 0.95, 0.05).toFixed(2);
          var translateY = (scrollY * 0.45).toFixed(1);
          var pointerNone = fadeProgress >= 0.85;
          var pointerChanged = pointerNone !== lastPointerNone;
          lastPointerNone = pointerNone;

          for (var i = 0; i < cachedHeroElements.length; i++) {
            var el = cachedHeroElements[i];
            el.style.opacity = opacityVal;
            el.style.transform = 'translate3d(0,' + translateY + 'px,0)';
            if (pointerChanged) {
              el.style.pointerEvents = pointerNone ? 'none' : 'auto';
            }
          }
        }
      } catch (err) {
        console.error('updateHeroParallax error:', err);
      }
      ticking = false;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateHeroParallax);
    } else {
      updateHeroParallax();
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeroParallax);
        ticking = true;
      }
    }, { passive: true });
    window.addEventListener('resize', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeroParallax);
        ticking = true;
      }
    }, { passive: true });
  })();

  // Unconditionally Nuke Mountain Images Across All Browsers
  (function() {
    function nukeMountainImages() {
      var imgs = document.querySelectorAll('.section-hero img, .hero-banner img, .hero img, [data-section-type="hero"] img, .theme-tusk .hero-media img, .hero__image, [data-section-key="headline"] .section-background-image, [data-section-key="headline"] .section-background img, [data-section-key="headline"] img, .section-background-image, img.section-background-image, img[src*="mountain"]');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].style.setProperty('display', 'none', 'important');
        imgs[i].style.setProperty('visibility', 'hidden', 'important');
        imgs[i].style.setProperty('opacity', '0', 'important');
        imgs[i].style.setProperty('height', '0px', 'important');
        imgs[i].style.setProperty('width', '0px', 'important');
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', nukeMountainImages);
    } else {
      nukeMountainImages();
    }
    setTimeout(nukeMountainImages, 300);
    setTimeout(nukeMountainImages, 1000);
  })();

  // Native Hero Title Glitch & Subtitle Formatting (Strictly NO hardcoded badge or terminal)
  (function() {
    function enhanceNativeHero() {
      var embeds = document.querySelectorAll(
        '[data-section-key="embed-code"], #content-section-yBbkPa6OGD, #remote-custom-embed, .sonarline-hero-section, .sonarline-homepage-experience'
      );
      for (var p = 0; p < embeds.length; p++) {
        embeds[p].style.setProperty('display', 'none', 'important');
        embeds[p].style.setProperty('height', '0px', 'important');
        embeds[p].style.setProperty('min-height', '0px', 'important');
        embeds[p].style.setProperty('max-height', '0px', 'important');
        embeds[p].style.setProperty('padding', '0px', 'important');
        embeds[p].style.setProperty('margin', '0px', 'important');
        embeds[p].style.setProperty('border', 'none', 'important');
        embeds[p].style.setProperty('overflow', 'hidden', 'important');
        embeds[p].style.setProperty('visibility', 'hidden', 'important');
        embeds[p].style.setProperty('pointer-events', 'none', 'important');
      }

      var heroContents = document.querySelector('[data-section-key="headline"] .section-contents, #content-section-LBNmnP42zK .section-contents, .section-hero .section-contents');
      if (!heroContents) return;

      var h1 = heroContents.querySelector('h1, .heading-text');
      if (!h1) return;

      // Purge any unparsed/hardcoded fallback status pills or terminal prompts
      var unparsedPills = heroContents.querySelectorAll('.sonarline-status-pill:not([data-shortcode-parsed])');
      for (var up = 0; up < unparsedPills.length; up++) unparsedPills[up].remove();

      var unparsedTerminals = heroContents.querySelectorAll('.sonarline-terminal-prompt:not([data-shortcode-parsed])');
      for (var ut = 0; ut < unparsedTerminals.length; ut++) unparsedTerminals[ut].remove();

      // Glitch / Scramble Effect on Native H1
      if (!h1.getAttribute('data-scramble-bound')) {
        h1.setAttribute('data-scramble-bound', 'true');
        var chars = '!<>-_\\/[]{}—=+*^?#________';
        var targetText = h1.innerText.trim();
        var iteration = 0;
        var interval = null;

        function runScramble() {
          iteration = 0;
          clearInterval(interval);
          interval = setInterval(function() {
            h1.innerText = targetText.split('').map(function(letter, index) {
              if (index < iteration) {
                return targetText[index];
              }
              return chars[Math.floor(Math.random() * chars.length)];
            }).join('');

            if (iteration >= targetText.length) {
              clearInterval(interval);
            }
            iteration += 1 / 3;
          }, 28);
        }

        runScramble();
        h1.addEventListener('mouseenter', runScramble);
      }

      // Format Subtitle Bullets & Center Subtitle and Category List
      var subtitleElements = heroContents.querySelectorAll('p, .richtext p, .category-list, .categories, .category-links, .category-link-wrapper, .categories-wrapper, [class*="category"]');
      for (var se = 0; se < subtitleElements.length; se++) {
        var subtitleP = subtitleElements[se];
        subtitleP.style.setProperty('text-align', 'center', 'important');
        subtitleP.style.setProperty('justify-content', 'center', 'important');
        subtitleP.style.setProperty('align-items', 'center', 'important');
        subtitleP.style.setProperty('margin-left', 'auto', 'important');
        subtitleP.style.setProperty('margin-right', 'auto', 'important');
        subtitleP.style.setProperty('margin-top', '0.5rem', 'important');
        subtitleP.style.setProperty('margin-bottom', '0px', 'important');
        subtitleP.style.setProperty('display', 'flex', 'important');
        subtitleP.style.setProperty('flex-wrap', 'wrap', 'important');
        subtitleP.style.setProperty('width', '100%', 'important');
        subtitleP.style.setProperty('max-width', '100%', 'important');
      }

      // Format bullets safely on text nodes to prevent destroying descendant DOM elements or nesting spans
      var walker = document.createTreeWalker(heroContents, NodeFilter.SHOW_TEXT, null, false);
      var textNode;
      var textNodesToFormat = [];
      while ((textNode = walker.nextNode())) {
        var parentNode = textNode.parentNode;
        if (parentNode && (parentNode.nodeName === 'SCRIPT' || parentNode.nodeName === 'STYLE')) continue;
        if (parentNode && parentNode.getAttribute && parentNode.getAttribute('data-bullet-span') === 'true') continue;
        var val = textNode.nodeValue;
        if (val && /(?:&bull;|&#8226;|[•·●])/.test(val)) {
          textNodesToFormat.push(textNode);
        }
      }
      for (var tn = 0; tn < textNodesToFormat.length; tn++) {
        var node = textNodesToFormat[tn];
        var parent = node.parentNode;
        if (!parent) continue;
        var parts = node.nodeValue.split(/(?:&bull;|&#8226;|[•·●])/);
        var frag = document.createDocumentFragment();
        for (var p = 0; p < parts.length; p++) {
          if (parts[p].length > 0) {
            frag.appendChild(document.createTextNode(parts[p]));
          }
          if (p < parts.length - 1) {
            var span = document.createElement('span');
            span.setAttribute('data-bullet-span', 'true');
            span.style.cssText = 'color: #ff3b30 !important; font-size: 0.9rem !important; margin: 0 6px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; vertical-align: middle !important;';
            span.textContent = '•';
            frag.appendChild(span);
          }
        }
        parent.replaceChild(frag, node);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceNativeHero);
    } else {
      enhanceNativeHero();
    }
    setTimeout(enhanceNativeHero, 300);
    setTimeout(enhanceNativeHero, 1000);
    setTimeout(enhanceNativeHero, 2500);
  })();
</script>
