<!-- LAB DECORATOR — header injection (fonts + early overlay + cache-busted theme CSS)
     Decorator-only. No brand strings. No hardcoded content.
     Full tag parsing + telemetry build lives in footer injection. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    document.documentElement.classList.add('lab-js');
    // Early noise overlay (footer decorator reuses if present — idempotent).
    if (!document.querySelector('.lab-noise-overlay')) {
      var n = document.createElement('div');
      n.className = 'lab-noise-overlay';
      n.setAttribute('aria-hidden', 'true');
      (document.body || document.documentElement).appendChild(n);
    }
    // Cache-busted theme CSS: same timestamp technique as the footer loader,
    // so style updates apply without manual CDN purges or stale browser cache.
    try {
      var cv = Date.now();
      var cssUrls = [
        'https://cdn.jsdelivr.net/gh/Th3Tamas/store-theme@main/storewide-store-pages-custom.css?v=' + cv,
        'https://raw.githubusercontent.com/Th3Tamas/store-theme/main/storewide-store-pages-custom.css?v=' + cv
      ];
      var existingCss = document.querySelector('link[data-lab-remote="css-dynamic"]');
      if (existingCss) {
        existingCss.href = cssUrls[0];
      } else {
        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.setAttribute('data-lab-remote', 'css-dynamic');
        cssLink.onerror = function () {
          if (document.querySelector('link[data-lab-remote="css-dynamic-fallback"]')) return;
          try {
            var fb = document.createElement('link');
            fb.rel = 'stylesheet';
            fb.setAttribute('data-lab-remote', 'css-dynamic-fallback');
            fb.href = cssUrls[1];
            document.head.appendChild(fb);
          } catch (e2) {}
        };
        cssLink.href = cssUrls[0];
        document.head.appendChild(cssLink);
      }
    } catch (e3) {}
  } catch (e) { /* no-op: never break native header */ }
})();
</script>
