<!-- ==========================================================================
     SONARLINE AUDIO - STOREWIDE HEADER INJECTION
     Boutique Hardware Sound Lab & Brutalist Architecture
     ========================================================================== -->

<!-- Meta & Theme -->
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">

<!-- Typography: Space Grotesk, Space Mono, Syne -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
  /* Terminal / HUD Preloader Overlay */
  #sonarline-hud-preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #080808;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Space Mono', 'JetBrains Mono', monospace;
    color: #ff3b30;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: all;
    user-select: none;
  }
  .hud-terminal-box {
    max-width: 520px;
    width: 90%;
    border: 1px solid rgba(255, 59, 48, 0.3);
    background: #0d0d0d;
    padding: 1.75rem 2rem;
    box-shadow: 0 0 40px rgba(255, 59, 48, 0.12);
  }
  .hud-terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 59, 48, 0.2);
    padding-bottom: 0.75rem;
    margin-bottom: 1.25rem;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.6);
  }
  .hud-terminal-logs {
    font-size: 0.8rem;
    line-height: 1.8;
    letter-spacing: 0.08em;
  }
  .hud-log-line {
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .hud-log-line.active {
    opacity: 1;
    transform: translateY(0);
  }
  .hud-log-line.success {
    color: #27c93f;
  }
</style>

<div id="sonarline-hud-preloader">
  <div class="hud-terminal-box">
    <div class="hud-terminal-header">
      <span>SONARLINE // KERNEL BOOT</span>
      <span>v2026.1</span>
    </div>
    <div class="hud-terminal-logs">
      <div class="hud-log-line" id="hud-line-1">&gt; INITIALIZING AUDIO ARCHIVE...</div>
      <div class="hud-log-line" id="hud-line-2">&gt; MOUNTING KERNEL: 48kHz / 24-BIT...</div>
      <div class="hud-log-line" id="hud-line-3">&gt; BUFFER ALLOCATED: 1024 SAMPLES</div>
      <div class="hud-log-line success" id="hud-line-4">&gt; STATUS: ONLINE [READY]</div>
    </div>
  </div>
</div>

<script>
  (function() {
    var preloader = document.getElementById('sonarline-hud-preloader');
    if (!preloader) return;

    // Check if session has already booted
    if (sessionStorage.getItem('sonarline_booted') === '1') {
      preloader.style.display = 'none';
      if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      return;
    }

    var lines = [
      document.getElementById('hud-line-1'),
      document.getElementById('hud-line-2'),
      document.getElementById('hud-line-3'),
      document.getElementById('hud-line-4')
    ];

    // Sequence timing: total ~1.2s
    setTimeout(function() { if (lines[0]) lines[0].classList.add('active'); }, 150);
    setTimeout(function() { if (lines[1]) lines[1].classList.add('active'); }, 400);
    setTimeout(function() { if (lines[2]) lines[2].classList.add('active'); }, 700);
    setTimeout(function() { if (lines[3]) lines[3].classList.add('active'); }, 950);

    setTimeout(function() {
      preloader.style.opacity = '0';
      preloader.style.pointerEvents = 'none';
      sessionStorage.setItem('sonarline_booted', '1');
      setTimeout(function() {
        if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      }, 500);
    }, 1250);
  })();
</script>

<!-- Top Red Scroll Indicator (Storewide) - Fluid Sub-pixel ScaleX with requestAnimationFrame -->
<style>
  #sonarline-scroll-progress {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 2px !important;
    background: #FF2A2A !important;
    z-index: 10000000 !important;
    transform-origin: 0 0 !important;
    transform: scaleX(0) !important;
    will-change: transform !important;
    pointer-events: none !important;
    transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1) !important;
  }
</style>
<script>
  (function() {
    var ticking = false;
    var bar = null;

    function getBar() {
      if (!bar) {
        bar = document.getElementById('sonarline-scroll-progress');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'sonarline-scroll-progress';
          document.documentElement.appendChild(bar);
        }
      }
      return bar;
    }

    function updateProgress() {
      var progressBar = getBar();
      var winScroll = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var ratio = height > 0 ? Math.min(Math.max(winScroll / height, 0), 1) : 0;
      if (progressBar) {
        progressBar.style.transform = 'scaleX(' + ratio + ')';
      }
      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        window.requestAnimationFrame(updateProgress);
        ticking = true;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', requestTick);
    } else {
      requestTick();
    }
    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick, { passive: true });
  })();

  // Header Nav Buttons & Mobile Icons Clean Guard
  (function() {
    function cleanHeaderButtons() {
      // 1. Hide mobile header icons on desktop
      if (window.innerWidth >= 769) {
        var mobileElems = document.querySelectorAll('.header-display-desktop .show-on-mobile, .show-on-mobile');
        for (var m = 0; m < mobileElems.length; m++) {
          mobileElems[m].style.setProperty('display', 'none', 'important');
        }
      }

      // 2. Remove newsletter form if present in DOM
      var newsletterForm = document.getElementById('sonarline-newsletter-form');
      if (newsletterForm) {
        var parentBox = newsletterForm.parentElement;
        if (parentBox && parentBox.classList.contains('sonarline-newsletter-box')) {
          parentBox.remove();
        } else if (parentBox) {
          parentBox.style.setProperty('display', 'none', 'important');
          newsletterForm.remove();
        } else {
          newsletterForm.remove();
        }
      }

      // 3. Ensure Cart and Action Buttons remain fully visible, unbordered, and padding-free
      var actionButtons = document.querySelectorAll('.header-cart-icon-button, .live-search-button-search, .header-actions .cart-wrap, .header-actions button');
      for (var c = 0; c < actionButtons.length; c++) {
        actionButtons[c].style.removeProperty('display');
        actionButtons[c].style.setProperty('border', 'none', 'important');
        actionButtons[c].style.setProperty('outline', 'none', 'important');
        actionButtons[c].style.setProperty('padding', '0px', 'important');
        actionButtons[c].style.setProperty('background', 'transparent', 'important');
        actionButtons[c].style.setProperty('box-shadow', 'none', 'important');
        actionButtons[c].style.setProperty('visibility', 'visible', 'important');
        actionButtons[c].style.setProperty('opacity', '1', 'important');
      }

      // 4. Ensure Login link icon is white
      var loginLinks = document.querySelectorAll('.header-login-icon-link');
      for (var l = 0; l < loginLinks.length; l++) {
        loginLinks[l].style.setProperty('color', '#ffffff', 'important');
        loginLinks[l].style.setProperty('border', 'none', 'important');
      }

      // 5. Revert SHOP link to native unbordered
      var shopLinks = document.querySelectorAll('.js-header-nav-item-link-level0, .js-header-nav-item-link-level0.active, header nav a');
      for (var k = 0; k < shopLinks.length; k++) {
        shopLinks[k].style.setProperty('border-bottom', 'none', 'important');
      }

      // 6. Hide duplicate desktop search if both full search form and icon button are present outside nav
      var navSearchLinks = document.querySelectorAll('.header-nav a[href*="search"], .navbar-nav a[href*="search"]');
      for (var s = 0; s < navSearchLinks.length; s++) {
        navSearchLinks[s].style.setProperty('display', 'none', 'important');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', cleanHeaderButtons);
    } else {
      cleanHeaderButtons();
    }
    setTimeout(cleanHeaderButtons, 300);
    setTimeout(cleanHeaderButtons, 1000);
    setTimeout(cleanHeaderButtons, 2500);
    window.addEventListener('resize', cleanHeaderButtons);
  })();

  // Unconditionally Nuke Mountain Images Across All Browsers
  (function() {
    function nukeMountainImages() {
      var imgs = document.querySelectorAll('.section-hero img, .hero-banner img, .hero img, [data-section-type="hero"] img, .theme-tusk .hero-media img, .hero__image, [data-section-key="headline"] .section-background-image, [data-section-key="headline"] .section-background img, [data-section-key="headline"] img, .section-background-image, img.section-background-image, img[src*="mountain"]');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].style.setProperty('display', 'none', 'important');
        imgs[i].style.setProperty('visibility', 'hidden', 'important');
        imgs[i].style.setProperty('opacity', '0', 'important');
        imgs[i].style.setProperty('height', '0px', 'important');
        imgs[i].style.setProperty('width', '0px', 'important');
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', nukeMountainImages);
    } else {
      nukeMountainImages();
    }
    setTimeout(nukeMountainImages, 300);
    setTimeout(nukeMountainImages, 1000);
  })();

  // Subtask 4: Interactive Hero Parallax Grid & Title Blur/Fade
  (function() {
    var ticking = false;
    function updateHeroParallax() {
      var heroEl = document.querySelector('[data-section-key="headline"], #content-section-LBNmnP42zK, .sonarline-hero-section');
      var headingEl = document.querySelector('[data-section-key="headline"] .heading-text, [data-section-key="headline"] h1, #sonarline-glitch-title');
      var subtitleEl = document.querySelector('[data-section-key="headline"] .section-contents p, [data-section-key="headline"] p, .sonarline-hero-content > div:last-child');

      if (heroEl) {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (scrollY < 0) scrollY = 0;

        // Translate grid background with subtle parallax
        var bgOffsetY = scrollY * 0.25;
        heroEl.style.backgroundPosition = 'center ' + bgOffsetY + 'px';

        // Blur and opacity fade as hero recedes behind content
        var fadeProgress = Math.min(scrollY / 450, 1);
        var blurPx = (fadeProgress * 6).toFixed(1);
        var opacityVal = Math.max(1 - fadeProgress * 0.85, 0.15).toFixed(2);

        if (headingEl) {
          headingEl.style.filter = 'blur(' + blurPx + 'px)';
          headingEl.style.opacity = opacityVal;
          headingEl.style.transform = 'translateY(' + (scrollY * 0.12) + 'px)';
          headingEl.style.pointerEvents = fadeProgress >= 0.9 ? 'none' : 'auto';
        }
        if (subtitleEl) {
          subtitleEl.style.filter = 'blur(' + (blurPx * 0.75).toFixed(1) + 'px)';
          subtitleEl.style.opacity = opacityVal;
          subtitleEl.style.transform = 'translateY(' + (scrollY * 0.12) + 'px)';
          subtitleEl.style.pointerEvents = fadeProgress >= 0.9 ? 'none' : 'auto';
        }
      }
      ticking = false;
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeroParallax);
        ticking = true;
      }
    }, { passive: true });
    window.addEventListener('resize', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeroParallax);
        ticking = true;
      }
    }, { passive: true });
  })();

  // Native Hero Enhancement: Status Pill, Glitch Title Scramble, Subtitle Red Bullets, Terminal Prompt
  (function() {
    function enhanceNativeHero() {
      // Clean up any lingering post-added embed hero sections
      var postHeroes = document.querySelectorAll('.sonarline-hero-section');
      for (var p = 0; p < postHeroes.length; p++) {
        postHeroes[p].remove();
      }

      var heroContents = document.querySelector('[data-section-key="headline"] .section-contents, #content-section-LBNmnP42zK .section-contents, .section-hero .section-contents');
      if (!heroContents) return;

      var h1 = heroContents.querySelector('h1, .heading-text');
      if (!h1) return;

      // 1. Inject Status Pill above H1
      var statusPill = heroContents.querySelector('.sonarline-status-pill');
      if (!statusPill) {
        statusPill = document.createElement('div');
        statusPill.className = 'sonarline-status-pill';
        statusPill.innerHTML = '<span class="sonarline-status-dot"></span>' +
          '<span>ARCHIVE ONLINE</span>' +
          '<span class="sonarline-status-sep">|</span>' +
          '<span class="sonarline-status-clock" id="sonarline-native-clock">00:00:00</span>' +
          '<span class="sonarline-status-sep">|</span>' +
          '<span>48kHz / 24-BIT</span>';
        heroContents.insertBefore(statusPill, h1);
      }

      // Live clock updater
      function updateClock() {
        var clockEl = document.getElementById('sonarline-native-clock');
        if (clockEl) {
          var now = new Date();
          var timeStr = now.toTimeString().split(' ')[0];
          clockEl.textContent = timeStr;
        }
      }
      updateClock();
      if (!window._sonarlineClockInterval) {
        window._sonarlineClockInterval = setInterval(updateClock, 1000);
      }

      // 2. Glitch / Scramble Effect on Native H1
      if (!h1.getAttribute('data-scramble-bound')) {
        h1.setAttribute('data-scramble-bound', 'true');
        var chars = '!<>-_\\/[]{}—=+*^?#________';
        var targetText = h1.innerText.trim();
        var iteration = 0;
        var interval = null;

        function runScramble() {
          iteration = 0;
          clearInterval(interval);
          interval = setInterval(function() {
            h1.innerText = targetText.split('').map(function(letter, index) {
              if (index < iteration) {
                return targetText[index];
              }
              return chars[Math.floor(Math.random() * chars.length)];
            }).join('');

            if (iteration >= targetText.length) {
              clearInterval(interval);
            }
            iteration += 1 / 3;
          }, 28);
        }

        runScramble();
        h1.addEventListener('mouseenter', runScramble);
      }

      // 3. Format Subtitle Bullets
      var subtitleP = heroContents.querySelector('p, .richtext p');
      if (subtitleP && !subtitleP.getAttribute('data-bullets-styled')) {
        subtitleP.setAttribute('data-bullets-styled', 'true');
        var rawHtml = subtitleP.innerHTML;
        var formattedHtml = rawHtml.replace(/[•·]/g, '<span style="color: #ff3b30; font-size: 0.9rem; margin: 0 4px;">&bull;</span>');
        subtitleP.innerHTML = formattedHtml;
      }

      // 4. Inject Terminal Prompt below subtitle
      var terminalPrompt = heroContents.querySelector('.sonarline-terminal-prompt');
      if (!terminalPrompt) {
        terminalPrompt = document.createElement('div');
        terminalPrompt.className = 'sonarline-terminal-prompt';
        terminalPrompt.innerHTML = '<span style="color: #ff3b30;">root@sonarline:~$</span> <span style="color: #ffffff;">archive --status active</span>';
        heroContents.appendChild(terminalPrompt);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceNativeHero);
    } else {
      enhanceNativeHero();
    }
    setTimeout(enhanceNativeHero, 300);
    setTimeout(enhanceNativeHero, 1000);
    setTimeout(enhanceNativeHero, 2500);
  })();
</script>
