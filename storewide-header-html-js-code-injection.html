<style>

<script>
  (function() {
    // Execution gate: restrict fullscreen preloader strictly to homepage root
    var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '') || '/';
    var isHomepage = (path === '/' || path === '' || path === '/index' || path === '/index.html' || path === '/sonarlineaudio');
    if (!isHomepage) {
      var existing = document.getElementById('sonarline-hud-preloader');
      if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
      }
      return;
    }

    // Dynamic Preloader Construction (Homepage only)
    var preloader = document.getElementById('sonarline-hud-preloader');
    if (!preloader) {
      preloader = document.createElement('div');
      preloader.id = 'sonarline-hud-preloader';
      preloader.innerHTML = '<div class="hud-center-container">' +
        '<div class="hud-brand-header">' +
          '<div class="hud-brand-title">SONARLINE <span class="hud-slash">/</span> <span class="hud-lab">lab</span></div>' +
          '<div class="hud-brand-sub">SOUND DESIGN LAB</div>' +
        '</div>' +
        '<div class="hud-terminal-readout" id="hud-terminal-readout">' +
          '<div class="hud-line" id="hud-line-0"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
          '<div class="hud-line" id="hud-line-1"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-2"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-3"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-4"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-5"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-6"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-7"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
          '<div class="hud-line" id="hud-line-8"><span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
        '</div>' +
        '<div class="hud-progress-bar-wrap">' +
          '<div class="hud-progress-line"><div class="hud-progress-fill" id="hud-progress-fill"></div></div>' +
          '<div class="hud-progress-footer">' +
            '<div class="hud-progress-status"><span class="hud-ready-sq">&#9632;</span> READY</div>' +
            '<div class="hud-progress-pct" id="hud-progress-pct">0%</div>' +
          '</div>' +
        '</div>' +
      '</div>';
      if (document.body) {
        document.body.insertBefore(preloader, document.body.firstChild);
      } else {
        document.documentElement.appendChild(preloader);
      }
    }

    var defaultLines = [
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
      '<span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span>'
    ];

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatCustomLine(rawText, isLast) {
      var s = rawText.trim();
      s = s.replace(/^(?:&gt;|>)\s*/, '');
      var okMatch = s.match(/(.*?)\s*\[\s*ok\s*\]/i);
      if (okMatch) {
        var cmd = okMatch[1].replace(/\.+$/, '').trim();
        return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(cmd) + '</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>';
      }
      if (isLast || /ready/i.test(s)) {
        var readyMatch = s.match(/^(.*?(?:ready\.?|welcome\.?))\s*(.*)$/i);
        if (readyMatch && readyMatch[1] && readyMatch[2]) {
          return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(readyMatch[1]) + '</span> <span class="hud-welcome">' + escapeHtml(readyMatch[2]) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
        }
        return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
      }
      return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
    }

    function scanForShortcode() {
      var root = document.body || document.documentElement;
      if (!root) return null;

      var re = /\[\[preloader:\s*([\s\S]*?)\]\](?=[^\]]|$)/i;

      // 1. Search for elements containing the shortcode
      var all = root.querySelectorAll('p, div, section, span, [data-section-key], article, main');
      var matches = [];
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.id === 'sonarline-hud-preloader' || el.closest('#sonarline-hud-preloader')) continue;
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;

        var html = el.innerHTML || '';
        var normalized = html.replace(/<br\s*\/?>/gi, '\n')
                             .replace(/<\/(?:p|div)>\s*<(?:p|div)[^>]*>/gi, '\n')
                             .replace(/<[^>]+>/g, ' ')
                             .replace(/&nbsp;/gi, ' ')
                             .replace(/&#160;/g, ' ');

        var textContent = (el.textContent || '').replace(/&nbsp;/gi, ' ').replace(/&#160;/g, ' ');

        if (re.test(normalized) || re.test(textContent)) {
          var rawM = normalized.match(re) || textContent.match(re);
          matches.push({ el: el, rawMatch: rawM });
        }
      }

      // 2. Find the innermost matching element (an element with no matching descendants)
      var innermost = null;
      for (var m = 0; m < matches.length; m++) {
        var cand = matches[m];
        var hasMatchingDescendant = false;
        for (var n = 0; n < matches.length; n++) {
          if (m !== n && cand.el.contains(matches[n].el)) {
            hasMatchingDescendant = true;
            break;
          }
        }
        if (!hasMatchingDescendant) {
          innermost = cand;
          break;
        }
      }

      // 3. If found via elements
      if (innermost && innermost.rawMatch) {
        var targetEl = innermost.el;
        
        // Hide the target element
        targetEl.style.setProperty('display', 'none', 'important');
        targetEl.style.setProperty('visibility', 'hidden', 'important');
        targetEl.style.setProperty('height', '0px', 'important');
        targetEl.setAttribute('data-preloader-hidden', 'true');

        // Check if the containing section wrapper only has this shortcode
        var sectionWrap = targetEl.parentElement ? targetEl.parentElement.closest('.section-wrapper, [data-section-key], .section, section, .rich-text-section') : null;
        if (sectionWrap) {
          var remaining = (sectionWrap.textContent || '').replace(re, '').trim();
          if (remaining.length < 5) {
            sectionWrap.style.setProperty('display', 'none', 'important');
            sectionWrap.style.setProperty('visibility', 'hidden', 'important');
            sectionWrap.style.setProperty('height', '0px', 'important');
            sectionWrap.style.setProperty('margin', '0px', 'important');
            sectionWrap.style.setProperty('padding', '0px', 'important');
            sectionWrap.setAttribute('data-preloader-hidden', 'true');
          }
        }

        var rawLines = innermost.rawMatch[1].split(/\r?\n|\|/);
        var parsed = [];
        for (var r = 0; r < rawLines.length; r++) {
          var line = rawLines[r].trim();
          if (line.length > 0) {
            parsed.push(line);
          }
        }
        if (parsed.length > 0) {
          return parsed;
        }
      }

      // 4. Fallback TreeWalker for text nodes
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      var textNode;
      while ((textNode = walker.nextNode())) {
        var val = (textNode.nodeValue || '').replace(/&nbsp;/gi, ' ').replace(/&#160;/g, ' ');
        if (val && re.test(val)) {
          var m = val.match(re);
          var parentEl = textNode.parentElement;
          if (parentEl && parentEl.id !== 'sonarline-hud-preloader' && !parentEl.closest('#sonarline-hud-preloader')) {
            parentEl.style.setProperty('display', 'none', 'important');
            parentEl.style.setProperty('visibility', 'hidden', 'important');
            parentEl.style.setProperty('height', '0px', 'important');
            parentEl.setAttribute('data-preloader-hidden', 'true');
            var sWrap = parentEl.parentElement ? parentEl.parentElement.closest('.section-wrapper, [data-section-key], .section, section, .rich-text-section') : null;
            if (sWrap) {
              var rem = (sWrap.textContent || '').replace(re, '').trim();
              if (rem.length < 5) {
                sWrap.style.setProperty('display', 'none', 'important');
                sWrap.style.setProperty('visibility', 'hidden', 'important');
                sWrap.style.setProperty('height', '0px', 'important');
                sWrap.style.setProperty('margin', '0px', 'important');
                sWrap.style.setProperty('padding', '0px', 'important');
                sWrap.setAttribute('data-preloader-hidden', 'true');
              }
            }
          }
          var linesArr = m[1].split(/\r?\n|\|/);
          var result = [];
          for (var x = 0; x < linesArr.length; x++) {
            var item = linesArr[x].trim();
            if (item.length > 0) result.push(item);
          }
          if (result.length > 0) return result;
        }
      }
      return null;
    }

    function startSequence(customLines) {
      var readoutEl = document.querySelector('#sonarline-hud-preloader .hud-terminal-readout');
      var pctEl = document.getElementById('hud-progress-pct');
      var fillEl = document.getElementById('hud-progress-fill');
      
      if (!fillEl) {
        var lineEl = document.querySelector('#sonarline-hud-preloader .hud-progress-line');
        if (lineEl) {
          fillEl = document.createElement('div');
          fillEl.className = 'hud-progress-fill';
          fillEl.id = 'hud-progress-fill';
          lineEl.appendChild(fillEl);
        }
      }

      var htmlLines = [];
      if (customLines && customLines.length > 0) {
        for (var c = 0; c < customLines.length; c++) {
          htmlLines.push(formatCustomLine(customLines[c], c === customLines.length - 1));
        }
      } else {
        htmlLines = defaultLines.slice();
      }

      var total = htmlLines.length;
      if (readoutEl) {
        var linesHtml = '';
        for (var h = 0; h < total; h++) {
          linesHtml += '<div class="hud-line" id="hud-line-' + h + '">' + htmlLines[h] + '</div>';
        }
        readoutEl.innerHTML = linesHtml;
      }

      var domLines = [];
      for (var d = 0; d < total; d++) {
        domLines.push(document.getElementById('hud-line-' + d));
      }

      var totalDuration = 2400;
      for (var idx = 0; idx < total; idx++) {
        (function(stepIdx) {
          var delay = (total <= 1) ? 150 : Math.round(150 + stepIdx * (totalDuration / (total - 1)));
          var pct = (stepIdx === total - 1) ? 100 : Math.round(((stepIdx + 0.8) / total) * 100);
          setTimeout(function() {
            if (domLines[stepIdx]) domLines[stepIdx].classList.add('active');
            if (pctEl) pctEl.textContent = pct + '%';
            if (fillEl) fillEl.style.width = pct + '%';
          }, delay);
        })(idx);
      }

      setTimeout(function() {
        if (pctEl) pctEl.textContent = '100%';
        if (fillEl) fillEl.style.width = '100%';
        preloader.style.opacity = '0';
        preloader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
        }, 450);
      }, 3000);
    }

    var customLines = scanForShortcode();
    if (customLines) {
      startSequence(customLines);
    } else if (document.readyState === 'loading') {
      var started = false;
      var onReady = function() {
        if (started) return;
        started = true;
        document.removeEventListener('DOMContentLoaded', onReady);
        var found = scanForShortcode();
        startSequence(found);
      };
      document.addEventListener('DOMContentLoaded', onReady);
      setTimeout(function() {
        if (!started) {
          started = true;
          var found = scanForShortcode();
          startSequence(found);
        }
      }, 1500);
    } else {
      startSequence(null);
    }
  })();
</script>

<!-- Top Red Scroll Indicator (Storewide) - Fluid Sub-pixel ScaleX with requestAnimationFrame -->
<style>
  #sonarline-scroll-progress {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 2px !important;
    background: #FF2A2A !important;
    z-index: 2147483647 !important;
    transform-origin: 0 0 !important;
    transform: scaleX(0);
    will-change: transform !important;
    pointer-events: none !important;
    transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1) !important;
  }
</style>
<script>
  (function() {
    var ticking = false;
    var bar = null;

    function getBar() {
      if (!bar) {
        bar = document.getElementById('sonarline-scroll-progress');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'sonarline-scroll-progress';
          if (document.body) {
            document.body.appendChild(bar);
          } else {
            document.documentElement.appendChild(bar);
          }
        }
      }
      return bar;
    }

    function updateProgress() {
      var progressBar = getBar();
      var scrollEl = document.scrollingElement || document.documentElement || document.body;
      var winScroll = window.scrollY || window.pageYOffset || scrollEl.scrollTop || 0;
      var maxScroll = Math.max(scrollEl.scrollHeight, document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;
      var ratio = maxScroll > 0 ? Math.min(Math.max(winScroll / maxScroll, 0), 1) : 0;
      if (progressBar) {
        progressBar.style.setProperty('transform', 'scaleX(' + ratio + ')', 'important');
      }
      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        window.requestAnimationFrame(updateProgress);
        ticking = true;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        getBar();
        requestTick();
      });
    } else {
      getBar();
      requestTick();
    }
    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick, { passive: true });
  })();

  // Product Card Image Recovery & Duplicate Title Elimination
  // Uses inline style setProperty to beat Payhip's lazy-loader inline styles
  (function() {
    function fixCardMedia(cardMedia) {
      cardMedia.style.setProperty('position', 'absolute', 'important');
      cardMedia.style.setProperty('top', '0', 'important');
      cardMedia.style.setProperty('left', '0', 'important');
      cardMedia.style.setProperty('right', '0', 'important');
      cardMedia.style.setProperty('bottom', '0', 'important');
      cardMedia.style.setProperty('width', '100%', 'important');
      cardMedia.style.setProperty('height', '100%', 'important');
      cardMedia.style.setProperty('margin', '0', 'important');
      cardMedia.style.setProperty('padding', '0', 'important');
      cardMedia.style.setProperty('overflow', 'hidden', 'important');
      cardMedia.style.setProperty('display', 'block', 'important');
    }

    function fixCardImage(img) {

    function cleanProductCards() {
      var cards = document.querySelectorAll('.card-wrapper, .product-card');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];

        // 1. Hide duplicate inner content inside card__inner
        var innerContent = card.querySelectorAll('.card__inner .card__content, .card__inner .card__information');
        for (var j = 0; j < innerContent.length; j++) {
          innerContent[j].style.setProperty('display', 'none', 'important');
          innerContent[j].style.setProperty('visibility', 'hidden', 'important');
          innerContent[j].style.setProperty('height', '0', 'important');
          innerContent[j].style.setProperty('overflow', 'hidden', 'important');
        }

        // 2. Fix card__inner: use padding-bottom:100% + height:0 ratio pattern
        // (NOT aspect-ratio - Payhip's theme uses padding-bottom trick; all children are position:absolute)
        var cardInner = card.querySelector('.card__inner');
        if (cardInner) {
          cardInner.style.setProperty('position', 'relative', 'important');
          cardInner.style.setProperty('overflow', 'hidden', 'important');
          cardInner.style.setProperty('display', 'block', 'important');
          cardInner.style.setProperty('width', '100%', 'important');
          cardInner.style.setProperty('height', '0', 'important');
          cardInner.style.setProperty('padding-top', '0', 'important');
          cardInner.style.setProperty('padding-bottom', '100%', 'important');
          cardInner.style.setProperty('box-sizing', 'content-box', 'important');
          cardInner.style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 3. Fix card__media: force absolute positioning
        var cardMedias = card.querySelectorAll('.card__media, .media');
        for (var k = 0; k < cardMedias.length; k++) {
          fixCardMedia(cardMedias[k]);
          cardMedias[k].style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 4. Fix all images inside cards: force position and top:0
        var imgs = card.querySelectorAll('img');
        for (var m = 0; m < imgs.length; m++) {
          fixCardImage(imgs[m]);
          imgs[m].style.setProperty('border-radius', '7px 7px 0 0', 'important');
        }

        // 5. Two-Row Metadata Layout & [[tag: CATEGORY_NAME]] Shortcode Engine (Image 1)
        var content = card.querySelector('.card > .card__content, .card__content:not(.card__inner *)');
        if (content) {
          var titleEl = content.querySelector('.card__heading, .font-section-collection-productName, h3, h4, .product-title, .product-name');
          var tagText = '';

          // Check title for [[tag: ...]]
          if (titleEl) {
            var rawTitle = titleEl.textContent || titleEl.innerText || '';
            var tagMatch = rawTitle.match(/\[\[tag:\s*([\s\S]*?)\]\]/i);
            if (tagMatch) {
              tagText = tagMatch[1].trim();
              // Strip [[tag: ...]] completely from title text and links
              var links = titleEl.querySelectorAll('a');
              if (links.length > 0) {
                for (var l = 0; l < links.length; l++) {
                  links[l].textContent = (links[l].textContent || '').replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
                }
              }
              titleEl.textContent = (titleEl.textContent || '').replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
            }
          }

          // Check card for [[tag: ...]] if not in title
          if (!tagText) {
            var cardRaw = card.textContent || '';
            var tagMatch2 = cardRaw.match(/\[\[tag:\s*([\s\S]*?)\]\]/i);
            if (tagMatch2) {
              tagText = tagMatch2[1].trim();
              var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
              var tn;
              while ((tn = walker.nextNode())) {
                if (tn.nodeValue && tn.nodeValue.includes('[[tag:')) {
                  tn.nodeValue = tn.nodeValue.replace(/\[\[tag:\s*([\s\S]*?)\]\]/gi, '').trim();
                }
              }
            }
          }

          // Fallback category if none specified
          if (!tagText) {
            var tUpper = (titleEl ? titleEl.textContent : card.textContent).toUpperCase();
            if (tUpper.includes('BUNDLE')) tagText = 'BUNDLE / KITS';
            else if (tUpper.includes('SAMPLE')) tagText = 'SAMPLE PACK';
            else if (tUpper.includes('DRUM')) tagText = 'DRUM KIT';
            else if (tUpper.includes('CREATIVE')) tagText = 'CREATIVE KIT';
            else if (tUpper.includes('MULTI')) tagText = 'MULTI-KIT';
            else if (tUpper.includes('PLUGIN') || tUpper.includes('WARMTONE')) tagText = 'PLUGIN';
            else tagText = 'SOUND LAB';
          }

          // Build or update two-row metadata container
          var metaWrap = content.querySelector('.sonarline-card-metadata');
          if (!metaWrap) {
            metaWrap = document.createElement('div');
            metaWrap.className = 'sonarline-card-metadata';
            metaWrap.innerHTML = 
              '<div class="sonarline-card-row-top">' +
                '<div class="sonarline-card-title-wrap"></div>' +

          // Place title in row 1
          var titleWrap = metaWrap.querySelector('.sonarline-card-title-wrap');
          if (titleEl && titleEl.parentElement !== titleWrap) {
            titleWrap.appendChild(titleEl);
          }

          // Update pill text in row 2
          var pillEl = metaWrap.querySelector('.sonarline-card-tag-pill');
          if (pillEl && pillEl.textContent !== tagText) {
            pillEl.textContent = tagText;
          }

          // Place price in row 2
          var priceEl = content.querySelector('.price-block, .price, [class*="price"]:not(.sonarline-card-price-wrap):not(.sonarline-card-row-bottom)');
          var priceWrap = metaWrap.querySelector('.sonarline-card-price-wrap');
          if (priceEl && priceEl.parentElement !== priceWrap && priceEl !== priceWrap) {
            priceWrap.appendChild(priceEl);
          }
        }
      }
    }

            break;

            needsClean = true;
            break;

      observer.observe(target, {

        childList: true,
        attributes: true,

        embeds[p].style.setProperty('height', '0px', 'important');
        embeds[p].style.setProperty('min-height', '0px', 'important');
        embeds[p].style.setProperty('max-height', '0px', 'important');
        embeds[p].style.setProperty('padding', '0px', 'important');
        embeds[p].style.setProperty('margin', '0px', 'important');
        embeds[p].style.setProperty('border', 'none', 'important');
        embeds[p].style.setProperty('overflow', 'hidden', 'important');
        embeds[p].style.setProperty('visibility', 'hidden', 'important');
        embeds[p].style.setProperty('pointer-events', 'none', 'important');
      }

      var heroContents = document.querySelector('[data-section-key="headline"] .section-contents, #content-section-LBNmnP42zK .section-contents, .section-hero .section-contents');
      if (!heroContents) return;

      var h1 = heroContents.querySelector('h1, .heading-text');
      if (!h1) return;

      // Purge any unparsed/hardcoded fallback status pills or terminal prompts
      var unparsedPills = heroContents.querySelectorAll('.sonarline-status-pill:not([data-shortcode-parsed])');
      for (var up = 0; up < unparsedPills.length; up++) unparsedPills[up].remove();

      var unparsedTerminals = heroContents.querySelectorAll('.sonarline-terminal-prompt:not([data-shortcode-parsed])');
      for (var ut = 0; ut < unparsedTerminals.length; ut++) unparsedTerminals[ut].remove();

      // Glitch / Scramble Effect on Native H1
      if (!h1.getAttribute('data-scramble-bound')) {
        h1.setAttribute('data-scramble-bound', 'true');
        var chars = '!<>-_\\/[]{}—=+*^?#________';
        var targetText = h1.innerText.trim();
        var iteration = 0;
        var interval = null;

        function runScramble() {
          iteration = 0;
          clearInterval(interval);
          interval = setInterval(function() {
            h1.innerText = targetText.split('').map(function(letter, index) {
              if (index < iteration) {
                return targetText[index];
              }
              return chars[Math.floor(Math.random() * chars.length)];
            }).join('');

            if (iteration >= targetText.length) {
              clearInterval(interval);
            }
            iteration += 1 / 3;
          }, 28);
        }

        runScramble();
        h1.addEventListener('mouseenter', runScramble);
      }

      // Format Subtitle Bullets & Center Subtitle and Category List
      var subtitleElements = heroContents.querySelectorAll('p, .richtext p, .category-list, .categories, .category-links, .category-link-wrapper, .categories-wrapper, [class*="category"]');
      for (var se = 0; se < subtitleElements.length; se++) {
        var subtitleP = subtitleElements[se];
        subtitleP.style.setProperty('text-align', 'center', 'important');
        subtitleP.style.setProperty('justify-content', 'center', 'important');
        subtitleP.style.setProperty('align-items', 'center', 'important');
        subtitleP.style.setProperty('margin-left', 'auto', 'important');
        subtitleP.style.setProperty('margin-right', 'auto', 'important');
        subtitleP.style.setProperty('margin-top', '0.5rem', 'important');
        subtitleP.style.setProperty('margin-bottom', '0px', 'important');
        subtitleP.style.setProperty('display', 'flex', 'important');
        subtitleP.style.setProperty('flex-wrap', 'wrap', 'important');
        subtitleP.style.setProperty('width', '100%', 'important');
        subtitleP.style.setProperty('max-width', '100%', 'important');
      }

      // Format bullets safely on text nodes to prevent destroying descendant DOM elements or nesting spans
      var walker = document.createTreeWalker(heroContents, NodeFilter.SHOW_TEXT, null, false);
      var textNode;
      var textNodesToFormat = [];
      while ((textNode = walker.nextNode())) {
        var parentNode = textNode.parentNode;
        if (parentNode && (parentNode.nodeName === 'SCRIPT' || parentNode.nodeName === 'STYLE')) continue;
        if (parentNode && parentNode.getAttribute && parentNode.getAttribute('data-bullet-span') === 'true') continue;
        var val = textNode.nodeValue;
        if (val && /(?:&bull;|&#8226;|[•·●])/.test(val)) {
          textNodesToFormat.push(textNode);
        }
      }
      for (var tn = 0; tn < textNodesToFormat.length; tn++) {
        var node = textNodesToFormat[tn];
        var parent = node.parentNode;
        if (!parent) continue;
        var parts = node.nodeValue.split(/(?:&bull;|&#8226;|[•·●])/);
        var frag = document.createDocumentFragment();
        for (var p = 0; p < parts.length; p++) {
          if (parts[p].length > 0) {
            frag.appendChild(document.createTextNode(parts[p]));
          }
          if (p < parts.length - 1) {
            var span = document.createElement('span');
            span.setAttribute('data-bullet-span', 'true');
            span.style.cssText = 'color: #ff3b30 !important; font-size: 0.9rem !important; margin: 0 6px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; vertical-align: middle !important;';
            span.textContent = '•';
            frag.appendChild(span);
          }
        }
        parent.replaceChild(frag, node);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceNativeHero);
    } else {
      enhanceNativeHero();
    }
    setTimeout(enhanceNativeHero, 300);
    setTimeout(enhanceNativeHero, 1000);
    setTimeout(enhanceNativeHero, 2500);
  })();
</script>
