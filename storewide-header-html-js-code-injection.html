<!-- ==========================================================================
     SONARLINE AUDIO - STOREWIDE HEADER INJECTION
     Boutique Hardware Sound Lab & Brutalist Architecture
     ========================================================================== -->

<!-- Meta & Theme -->
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">

<!-- Typography: Space Grotesk, Space Mono, Syne -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
  /* Terminal / HUD Preloader Overlay */
  #sonarline-hud-preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #080808;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Space Mono', 'JetBrains Mono', monospace;
    color: #ff3b30;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: all;
    user-select: none;
  }
  .hud-terminal-box {
    max-width: 520px;
    width: 90%;
    border: 1px solid rgba(255, 59, 48, 0.3);
    background: #0d0d0d;
    padding: 1.75rem 2rem;
    box-shadow: 0 0 40px rgba(255, 59, 48, 0.12);
  }
  .hud-terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 59, 48, 0.2);
    padding-bottom: 0.75rem;
    margin-bottom: 1.25rem;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.6);
  }
  .hud-terminal-logs {
    font-size: 0.8rem;
    line-height: 1.8;
    letter-spacing: 0.08em;
  }
  .hud-log-line {
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .hud-log-line.active {
    opacity: 1;
    transform: translateY(0);
  }
  .hud-log-line.success {
    color: #27c93f;
  }
</style>

<div id="sonarline-hud-preloader">
  <div class="hud-terminal-box">
    <div class="hud-terminal-header">
      <span>SONARLINE // KERNEL BOOT</span>
      <span>v2026.1</span>
    </div>
    <div class="hud-terminal-logs">
      <div class="hud-log-line" id="hud-line-1">&gt; INITIALIZING AUDIO ARCHIVE...</div>
      <div class="hud-log-line" id="hud-line-2">&gt; MOUNTING KERNEL: 48kHz / 24-BIT...</div>
      <div class="hud-log-line" id="hud-line-3">&gt; BUFFER ALLOCATED: 1024 SAMPLES</div>
      <div class="hud-log-line success" id="hud-line-4">&gt; STATUS: ONLINE [READY]</div>
    </div>
  </div>
</div>

<script>
  (function() {
    var preloader = document.getElementById('sonarline-hud-preloader');
    if (!preloader) return;

    // Check if session has already booted
    if (sessionStorage.getItem('sonarline_booted') === '1') {
      preloader.style.display = 'none';
      if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      return;
    }

    var lines = [
      document.getElementById('hud-line-1'),
      document.getElementById('hud-line-2'),
      document.getElementById('hud-line-3'),
      document.getElementById('hud-line-4')
    ];

    // Sequence timing: total ~1.2s
    setTimeout(function() { if (lines[0]) lines[0].classList.add('active'); }, 150);
    setTimeout(function() { if (lines[1]) lines[1].classList.add('active'); }, 400);
    setTimeout(function() { if (lines[2]) lines[2].classList.add('active'); }, 700);
    setTimeout(function() { if (lines[3]) lines[3].classList.add('active'); }, 950);

    setTimeout(function() {
      preloader.style.opacity = '0';
      preloader.style.pointerEvents = 'none';
      sessionStorage.setItem('sonarline_booted', '1');
      setTimeout(function() {
        if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
      }, 500);
    }, 1250);
  })();
</script>

<!-- Top Red Scroll Indicator (Storewide) -->
<div id="sonarline-scroll-progress"></div>
<style>
  #sonarline-scroll-progress {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    height: 2px !important;
    background: #FF2A2A !important;
    z-index: 10000000 !important;
    width: 0%;
    pointer-events: none !important;
    transition: width 0.05s ease-out;
  }
</style>
<script>
  (function() {
    function updateScrollProgress() {
      var winScroll = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      var bar = document.getElementById('sonarline-scroll-progress');
      if (bar) bar.style.width = scrolled + '%';
    }
    window.addEventListener('scroll', updateScrollProgress, { passive: true });
    window.addEventListener('resize', updateScrollProgress, { passive: true });
    updateScrollProgress();
  })();

  // Header Nav Buttons & Mobile Icons Clean Guard
  (function() {
    function cleanHeaderButtons() {
      // 1. Hide mobile header icons on desktop
      if (window.innerWidth >= 769) {
        var mobileElems = document.querySelectorAll('.header-display-desktop .show-on-mobile, .show-on-mobile');
        for (var m = 0; m < mobileElems.length; m++) {
          mobileElems[m].style.setProperty('display', 'none', 'important');
        }
      }

      // 2. Remove newsletter form if present in DOM
      var newsletterForm = document.getElementById('sonarline-newsletter-form');
      if (newsletterForm) {
        var parentBox = newsletterForm.parentElement;
        if (parentBox && parentBox.classList.contains('sonarline-newsletter-box')) {
          parentBox.remove();
        } else if (parentBox) {
          parentBox.style.setProperty('display', 'none', 'important');
          newsletterForm.remove();
        } else {
          newsletterForm.remove();
        }
      }

      // 3. Ensure Cart and Action Buttons remain fully visible and operational
      var cartButtons = document.querySelectorAll('.header-cart-icon-button, .header-actions .cart-wrap');
      for (var c = 0; c < cartButtons.length; c++) {
        cartButtons[c].style.removeProperty('display');
        cartButtons[c].style.setProperty('visibility', 'visible', 'important');
        cartButtons[c].style.setProperty('opacity', '1', 'important');
      }

      // 4. Hide duplicate desktop search if both full search form and icon button are present outside nav
      var navSearchLinks = document.querySelectorAll('.header-nav a[href*="search"], .navbar-nav a[href*="search"]');
      for (var s = 0; s < navSearchLinks.length; s++) {
        navSearchLinks[s].style.setProperty('display', 'none', 'important');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', cleanHeaderButtons);
    } else {
      cleanHeaderButtons();
    }
    setTimeout(cleanHeaderButtons, 300);
    setTimeout(cleanHeaderButtons, 1000);
    setTimeout(cleanHeaderButtons, 2500);
    window.addEventListener('resize', cleanHeaderButtons);
  })();

  // Unconditionally Nuke Mountain Images Across All Browsers
  (function() {
    function nukeMountainImages() {
      var imgs = document.querySelectorAll('.section-hero img, .hero-banner img, .hero img, [data-section-type="hero"] img, .theme-tusk .hero-media img, .hero__image, [data-section-key="headline"] .section-background-image, [data-section-key="headline"] .section-background img, [data-section-key="headline"] img, .section-background-image, img.section-background-image, img[src*="mountain"]');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].style.setProperty('display', 'none', 'important');
        imgs[i].style.setProperty('visibility', 'hidden', 'important');
        imgs[i].style.setProperty('opacity', '0', 'important');
        imgs[i].style.setProperty('height', '0px', 'important');
        imgs[i].style.setProperty('width', '0px', 'important');
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', nukeMountainImages);
    } else {
      nukeMountainImages();
    }
    setTimeout(nukeMountainImages, 300);
    setTimeout(nukeMountainImages, 1000);
  })();

  // Subtask 4: Interactive Hero Parallax Grid & Title Blur/Fade
  (function() {
    var ticking = false;
    function updateHeroParallax() {
      var heroEl = document.querySelector('[data-section-key="headline"], #content-section-LBNmnP42zK');
      var headingEl = document.querySelector('[data-section-key="headline"] .heading-text, [data-section-key="headline"] h1');
      var subtitleEl = document.querySelector('[data-section-key="headline"] .section-contents p, [data-section-key="headline"] p');

      if (heroEl) {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (scrollY < 0) scrollY = 0;

        // Translate grid background with subtle parallax
        var bgOffsetY = scrollY * 0.25;
        heroEl.style.backgroundPosition = 'center ' + bgOffsetY + 'px';

        // Blur and opacity fade as hero recedes behind content
        var fadeProgress = Math.min(scrollY / 450, 1);
        var blurPx = (fadeProgress * 6).toFixed(1);
        var opacityVal = Math.max(1 - fadeProgress * 0.85, 0.15).toFixed(2);

        if (headingEl) {
          headingEl.style.filter = 'blur(' + blurPx + 'px)';
          headingEl.style.opacity = opacityVal;
          headingEl.style.transform = 'translateY(' + (scrollY * 0.12) + 'px)';
        }
        if (subtitleEl) {
          subtitleEl.style.filter = 'blur(' + (blurPx * 0.75).toFixed(1) + 'px)';
          subtitleEl.style.opacity = opacityVal;
          subtitleEl.style.transform = 'translateY(' + (scrollY * 0.12) + 'px)';
        }
      }
      ticking = false;
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeroParallax);
        ticking = true;
      }
    }, { passive: true });
  })();
</script>
