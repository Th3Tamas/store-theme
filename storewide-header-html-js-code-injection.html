<style>

<script>
  (function() {
    var isDismissed = false;

    function dismissPreloader() {
      isDismissed = true;
      try {
        var ids = ['sonarline-preloader', 'sonarline-hud-preloader'];
        for (var i = 0; i < ids.length; i++) {
          var el = document.getElementById(ids[i]);
          if (el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('pointer-events', 'none', 'important');
            if (typeof el.remove === 'function') {
              el.remove();
            } else if (el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }
        }
        if (preloader) {
          preloader.style.setProperty('display', 'none', 'important');
          preloader.style.setProperty('visibility', 'hidden', 'important');
          preloader.style.setProperty('opacity', '0', 'important');
          preloader.style.setProperty('pointer-events', 'none', 'important');
          if (typeof preloader.remove === 'function') {
            preloader.remove();
          } else if (preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }
        if (document.body) {
          document.body.style.removeProperty('overflow');
          document.body.style.overflow = '';
        }
        if (document.documentElement) {
          document.documentElement.style.removeProperty('overflow');
          document.documentElement.style.overflow = '';
        }
        if (!document.body && typeof document.addEventListener === 'function') {
          document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
              document.body.style.removeProperty('overflow');
              document.body.style.overflow = '';
            }
          });
        }
      } catch (err) {
        console.error('dismissPreloader error:', err);
      }
    }

    // Mandatory fail-safe timer: if preloader has not finished within 2.5 seconds, force-dismiss
    var failsafeTimer = setTimeout(function() {
      dismissPreloader();
    }, 2500);

    var preloader = null;

    try {
      // Execution gate: restrict fullscreen preloader strictly to homepage root
      var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '') || '/';
      var isHomepage = (path === '/' || path === '' || path === '/index' || path === '/index.html' || path === '/sonarlineaudio');
      if (!isHomepage) {
        dismissPreloader();
        if (failsafeTimer) clearTimeout(failsafeTimer);
        return;
      }

      // Dynamic Preloader Construction (Homepage only)
      preloader = document.getElementById('sonarline-hud-preloader') || document.getElementById('sonarline-preloader');
      if (!preloader) {
        preloader = document.createElement('div');
        preloader.id = 'sonarline-hud-preloader';
        preloader.innerHTML = '<div class="hud-center-container">' +
          '<div class="hud-brand-header">' +
            '<div class="hud-brand-title" id="hud-brand-title"><span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important;">SONARLINE</span> <span class="hud-slash" style="color: #FF2A2A !important; margin: 0 4px !important; font-weight: 700 !important;">/</span> <span class="hud-title-second" style="color: #FF2A2A !important; font-weight: 400 !important;">lab</span></div>' +
            '<div class="hud-brand-sub" id="hud-brand-sub">SOUND DESIGN LAB</div>' +
          '</div>' +
          '<div class="hud-terminal-readout" id="hud-terminal-readout">' +
            '<div class="hud-line" id="hud-line-0"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
            '<div class="hud-line" id="hud-line-1"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-2"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-3"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-4"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-5"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-6"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-7"><span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span></div>' +
            '<div class="hud-line" id="hud-line-8"><span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span></div>' +
          '</div>' +
          '<div class="hud-progress-bar-wrap">' +
            '<div class="hud-progress-line"><div class="hud-progress-fill" id="hud-progress-fill"></div></div>' +
            '<div class="hud-progress-footer">' +
              '<div class="hud-progress-status"><span class="hud-ready-sq">&#9632;</span> READY</div>' +
              '<div class="hud-progress-pct" id="hud-progress-pct">0%</div>' +
            '</div>' +
          '</div>' +
        '</div>';
        if (document.body) {
          document.body.insertBefore(preloader, document.body.firstChild);
        } else {
          document.documentElement.appendChild(preloader);
        }
      }

      var defaultLines = [
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">initializing system...</span><span class="hud-dots"></span><span class="hud-status"></span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading core modules</span><span class="hud-dots">............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">connecting audio engine</span><span class="hud-dots">.........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading sample library</span><span class="hud-dots">..........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">calibrating interface</span><span class="hud-dots">...........</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">loading assets</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">verifying session</span><span class="hud-dots">...............</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">final checks</span><span class="hud-dots">....................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>',
        '<span class="hud-prompt">&gt;</span> <span class="hud-ready">system ready.</span> <span class="hud-welcome">welcome.</span><span class="hud-dots"></span><span class="hud-status"></span>'
      ];

      function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderBrandHeader(titleStr, secondaryStr) {
        var titleEl = document.getElementById('hud-brand-title');
        var subEl = document.getElementById('hud-brand-sub');

        var rawTitle = (titleStr || 'SONARLINE / lab').trim();
        if (titleEl) {
          if (rawTitle.indexOf('/') !== -1) {
            var parts = rawTitle.split('/');
            var first = parts[0].trim();
            var second = parts.slice(1).join('/').trim();
            titleEl.innerHTML = '<span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important; text-transform: uppercase !important;">' + escapeHtml(first) + '</span> ' +
              '<span class="hud-slash" style="color: #FF2A2A !important; margin: 0 4px !important; font-weight: 700 !important;">/</span> ' +
              '<span class="hud-title-second" style="color: #FF2A2A !important; font-weight: 400 !important; text-transform: uppercase !important;">' + escapeHtml(second) + '</span>';
          } else {
            titleEl.innerHTML = '<span class="hud-title-first" style="color: #ffffff !important; font-weight: 700 !important; text-transform: uppercase !important;">' + escapeHtml(rawTitle) + '</span>';
          }
        }

        var rawSub = (secondaryStr || 'SOUND DESIGN LAB').trim();
        if (subEl) {
          subEl.textContent = rawSub;
        }
      }

      function formatCustomLine(rawText, isLast) {
        var s = rawText.trim();
        s = s.replace(/^(?:&gt;|>)\s*/, '');
        var okMatch = s.match(/(.*?)\s*\[\s*ok\s*\]/i);
        if (okMatch) {
          var cmd = okMatch[1].replace(/\.+$/, '').trim();
          return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(cmd) + '</span><span class="hud-dots">..................</span> <span class="hud-status">[<span class="hud-ok">OK</span>]</span>';
        }
        if (isLast || /ready/i.test(s)) {
          var readyMatch = s.match(/^(.*?(?:ready\.?|welcome\.?))\s*(.*)$/i);
          if (readyMatch && readyMatch[1] && readyMatch[2]) {
            return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(readyMatch[1]) + '</span> <span class="hud-welcome">' + escapeHtml(readyMatch[2]) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
          }
          return '<span class="hud-prompt">&gt;</span> <span class="hud-ready">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
        }
        return '<span class="hud-prompt">&gt;</span> <span class="hud-cmd">' + escapeHtml(s) + '</span><span class="hud-dots"></span><span class="hud-status"></span>';
      }

      function scanForPreloaderConfig() {
        var root = document.body || document.documentElement;
        var config = {
          title: null,
          secondary: null,
          lines: null
        };
        if (!root) return config;

        var titleRe = /\[\[loader-title:\s*([\s\S]*?)\]\]/i;
        var secondaryRe = /\[\[loader-secondary:\s*([\s\S]*?)\]\]/i;
        var linesRe = /\[\[preloader:\s*([\s\S]*?)\]\]/i;

        var titleGlobalRe = /\[\[loader-title:\s*[\s\S]*?\]\]/gi;
        var secondaryGlobalRe = /\[\[loader-secondary:\s*[\s\S]*?\]\]/gi;
        var linesGlobalRe = /\[\[preloader:\s*[\s\S]*?\]\]/gi;

        // 1. Target sections and containers containing [[preloader:
        var candidateElements = root.querySelectorAll(
          '#content-section-ZGXLnKKrGq, [data-section-unique-id="content-section-ZGXLnKKrGq"], [data-section-key="text-simple"], [data-section-key="rich-text"], .richtext, .rich-text, .section-wrapper'
        );
        for (var r = 0; r < candidateElements.length; r++) {
          var cand = candidateElements[r];
          if (!cand || cand.id === 'sonarline-hud-preloader' || cand.id === 'sonarline-preloader' ||
              cand.closest('#sonarline-hud-preloader, #sonarline-preloader')) {
            continue;
          }

          var rawHtml = cand.innerHTML || '';
          var candText = cand.textContent || '';
          var candInner = cand.innerText || '';

          if (candText.indexOf('[[preloader:') !== -1 || rawHtml.indexOf('[[preloader:') !== -1 || candInner.indexOf('[[preloader:') !== -1) {
            var normalizedText = rawHtml
              .replace(/<br\s*\/?>/gi, '\n')
              .replace(/<\/(?:p|div|li)>\s*<(?:p|div|li)[^>]*>/gi, '\n')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&#160;/g, ' ');

            if (!config.lines) {
              var lm = normalizedText.match(linesRe) || candInner.match(linesRe) || candText.match(linesRe);
              if (lm && lm[1]) {
                var rawLines = lm[1].split(/\r?\n|\|/);
                var parsed = [];
                for (var l = 0; l < rawLines.length; l++) {
                  var line = rawLines[l].trim();
                  if (line.length > 0) parsed.push(line);
                }
                if (parsed.length > 0) config.lines = parsed;
              }
            }

            if (!config.title && (candText.indexOf('[[loader-title:') !== -1 || rawHtml.indexOf('[[loader-title:') !== -1)) {
              var tm = normalizedText.match(titleRe) || candInner.match(titleRe) || candText.match(titleRe);
              if (tm && tm[1]) config.title = tm[1].trim();
            }
            if (!config.secondary && (candText.indexOf('[[loader-secondary:') !== -1 || rawHtml.indexOf('[[loader-secondary:') !== -1)) {
              var sm = normalizedText.match(secondaryRe) || candInner.match(secondaryRe) || candText.match(secondaryRe);
              if (sm && sm[1]) config.secondary = sm[1].trim();
            }

            var sec = cand.closest('[data-section-key="text-simple"], [data-section-key="rich-text"], #content-section-ZGXLnKKrGq, .section-wrapper');
            if (!sec) sec = cand;

            if (sec !== document.body && sec !== document.documentElement && !sec.classList.contains('content-main-wrapper')) {
              sec.style.setProperty('display', 'none', 'important');
              sec.style.setProperty('visibility', 'hidden', 'important');
              sec.style.setProperty('height', '0px', 'important');
              sec.style.setProperty('min-height', '0px', 'important');
              sec.style.setProperty('max-height', '0px', 'important');
              sec.style.setProperty('margin', '0px', 'important');
              sec.style.setProperty('padding', '0px', 'important');
              sec.style.setProperty('padding-top', '0px', 'important');
              sec.style.setProperty('padding-bottom', '0px', 'important');
              sec.style.setProperty('opacity', '0', 'important');
              sec.style.setProperty('pointer-events', 'none', 'important');
              sec.setAttribute('data-preloader-hidden', 'true');
              sec.innerHTML = '';
            }
            cand.style.setProperty('display', 'none', 'important');
            cand.setAttribute('data-preloader-hidden', 'true');
            cand.innerHTML = '';
          }
        }

        // 2. Walk text nodes to safely extract and replace tokens without touching surrounding layout/containers
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var textNode;
        while ((textNode = walker.nextNode())) {
          if (!textNode.parentElement) continue;
          if (textNode.parentElement.id === 'sonarline-hud-preloader' || textNode.parentElement.id === 'sonarline-preloader' ||
              textNode.parentElement.closest('#sonarline-hud-preloader, #sonarline-preloader')) {
            continue;
          }
          var parentTag = textNode.parentElement.tagName;
          if (parentTag === 'SCRIPT' || parentTag === 'STYLE' || parentTag === 'NOSCRIPT') continue;

          var val = textNode.nodeValue || '';
          if (!val) continue;

          if (titleRe.test(val)) {
            if (!config.title) {
              var tm2 = val.match(titleRe);
              if (tm2 && tm2[1]) config.title = tm2[1].trim();
            }
            textNode.textContent = textNode.textContent.replace(titleGlobalRe, '');
            val = textNode.nodeValue || '';
          }

          if (secondaryRe.test(val)) {
            if (!config.secondary) {
              var sm2 = val.match(secondaryRe);
              if (sm2 && sm2[1]) config.secondary = sm2[1].trim();
            }
            textNode.textContent = textNode.textContent.replace(secondaryGlobalRe, '');
            val = textNode.nodeValue || '';
          }

          if (linesRe.test(val)) {
            if (!config.lines) {
              var lm2 = val.match(linesRe);
              if (lm2 && lm2[1]) {
                var rawLines2 = lm2[1].split(/\r?\n|\|/);
                var parsed2 = [];
                for (var k = 0; k < rawLines2.length; k++) {
                  var line2 = rawLines2[k].trim();
                  if (line2.length > 0) parsed2.push(line2);
                }
                if (parsed2.length > 0) config.lines = parsed2;
              }
            }
            textNode.textContent = textNode.textContent.replace(linesGlobalRe, '');
            var containingSec = textNode.parentElement.closest('[data-section-key="text-simple"], [data-section-key="rich-text"], #content-section-ZGXLnKKrGq, .section-wrapper, .richtext, .rich-text');
            if (containingSec && containingSec !== document.body && containingSec !== document.documentElement && !containingSec.classList.contains('content-main-wrapper')) {
              containingSec.style.setProperty('display', 'none', 'important');
              containingSec.style.setProperty('visibility', 'hidden', 'important');

              containingSec.style.setProperty('padding', '0px', 'important');

              containingSec.setAttribute('data-preloader-hidden', 'true');

      function startSequence(config) {
        try {
          if (isDismissed) return;
          config = config || {};
          renderBrandHeader(config.title, config.secondary);

          var pEl = preloader || document.getElementById('sonarline-hud-preloader') || document.getElementById('sonarline-preloader');
          var readoutEl = pEl ? pEl.querySelector('.hud-terminal-readout') : document.querySelector('#sonarline-hud-preloader .hud-terminal-readout, #sonarline-preloader .hud-terminal-readout');
          var pctEl = document.getElementById('hud-progress-pct') || (pEl ? pEl.querySelector('.hud-progress-pct') : null);
          var fillEl = document.getElementById('hud-progress-fill') || (pEl ? pEl.querySelector('.hud-progress-fill') : null);
          
          if (!fillEl && pEl) {
            var lineEl = pEl.querySelector('.hud-progress-line');
            if (lineEl) {
              fillEl = document.createElement('div');
              fillEl.className = 'hud-progress-fill';
              fillEl.id = 'hud-progress-fill';
              lineEl.appendChild(fillEl);
            }
          }

          var customLines = config.lines;
          var htmlLines = [];
          if (customLines && customLines.length > 0) {
            for (var c = 0; c < customLines.length; c++) {
              htmlLines.push(formatCustomLine(customLines[c], c === customLines.length - 1));
            }
          } else {
            htmlLines = defaultLines.slice();
          }

          var total = htmlLines.length;
          if (readoutEl) {
            var linesHtml = '';
            for (var h = 0; h < total; h++) {
              linesHtml += '<div class="hud-line" id="hud-line-' + h + '">' + htmlLines[h] + '</div>';
            }
            readoutEl.innerHTML = linesHtml;
          }

          var domLines = [];
          for (var d = 0; d < total; d++) {
            domLines.push(document.getElementById('hud-line-' + d));
          }

          // Precalculate ascending random incremental percentages
          var currentProgress = 0;
          var stepPcts = [];
          for (var s = 0; s < total; s++) {
            if (s === total - 1) {
              stepPcts.push(100);
            } else {
              currentProgress += Math.floor(Math.random() * 20) + 10;
              if (currentProgress > 95) currentProgress = 95;
              if (s > 0 && currentProgress <= stepPcts[s - 1]) {
                currentProgress = Math.min(stepPcts[s - 1] + Math.floor(Math.random() * 5) + 1, 95);
              }
              stepPcts.push(currentProgress);
            }
          }

          var totalDuration = 1200;
          for (var idx = 0; idx < total; idx++) {
            (function(stepIdx) {
              var delay = (total <= 1) ? 100 : Math.round(100 + stepIdx * (totalDuration / (total - 1)));
              var pct = stepPcts[stepIdx];
              setTimeout(function() {
                try {
                  if (isDismissed) return;
                  if (domLines[stepIdx]) domLines[stepIdx].classList.add('active');
                  if (pctEl) pctEl.textContent = pct + '%';
                  if (fillEl) fillEl.style.setProperty('width', pct + '%', 'important');

                  // When final sequence completes at 100%, hold for 100ms, then smoothly fade out and unmount
                  if (stepIdx === total - 1) {

                          ov.style.pointerEvents = 'none';

                          dismissPreloader();
                          if (failsafeTimer) clearTimeout(failsafeTimer);
                        }, 250);
                      } catch (fadeErr) {
                        console.error('Preloader fade error:', fadeErr);
                        dismissPreloader();
                      }
                    }, 100);
                  }
                } catch (stepErr) {
                  console.error('Preloader step error:', stepErr);
                  dismissPreloader();
                }
              }, delay);
            })(idx);
          }
        } catch (seqErr) {
          console.error('Preloader startSequence error:', seqErr);
          dismissPreloader();
        }
      }

      var config = scanForPreloaderConfig();
      if (config.lines || config.title || config.secondary) {
        startSequence(config);
      } else if (document.readyState === 'loading') {
        var started = false;
        var onReady = function() {
          try {
            if (started || isDismissed) return;
            started = true;
            document.removeEventListener('DOMContentLoaded', onReady);
            var found = scanForPreloaderConfig();
            startSequence(found);
          } catch (onReadyErr) {
            console.error('Preloader onReady exception:', onReadyErr);
            dismissPreloader();
          }
        };
        document.addEventListener('DOMContentLoaded', onReady);
        setTimeout(function() {
          try {
            if (!started && !isDismissed) {

              startSequence(found);
            }
          } catch (timeoutErr) {
            console.error('Preloader timeout exception:', timeoutErr);
            dismissPreloader();
          }
        }, 300);
      } else {
        startSequence({});
      }
    } catch (lifecycleErr) {
      console.error('Preloader lifecycle exception:', lifecycleErr);
      dismissPreloader();
    }

            document.body.appendChild(bar);

      var progressBar = getBar();
      var scrollEl = document.scrollingElement || document.documentElement || document.body;
      var winScroll = window.scrollY || window.pageYOffset || scrollEl.scrollTop || 0;
      var maxScroll = Math.max(scrollEl.scrollHeight, document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;

    function ensureModal() {
      var modal = document.getElementById('sonarline-product-modal');
      if (!modal) {
        var wrapper = document.createElement('div');
        wrapper.innerHTML = modalHtml;
        modal = wrapper.firstElementChild;
        (document.body || document.documentElement).appendChild(modal);

        var closeBtn = modal.querySelector('.sonarline-modal-close');
        var backdrop = modal.querySelector('.sonarline-modal-backdrop');
        var prevBtn = modal.querySelector('.sonarline-modal-prev');
        var nextBtn = modal.querySelector('.sonarline-modal-next');
        var playBtn = modal.querySelector('.sonarline-audio-play-btn');
        var scrubber = modal.querySelector('.sonarline-audio-scrubber');
        var volumeInput = modal.querySelector('.sonarline-audio-volume');
        var progress = modal.querySelector('.sonarline-audio-track-progress');
        var timeEl = modal.querySelector('.sonarline-audio-time');
        var waveformWrap = modal.querySelector('.sonarline-waveform-wrap');
        var waveformCanvas = modal.querySelector('.sonarline-waveform-canvas');
        var wfCtx = waveformCanvas ? waveformCanvas.getContext('2d') : null;
        var wfAnimId = null;

        // Volume Persistence
        try {
          var savedVol = localStorage.getItem('sonarline_audio_vol');
          if (savedVol !== null) {
            var v = parseFloat(savedVol);
            if (!isNaN(v) && v >= 0 && v <= 1) {
              audioEngine.volume = v;
              if (volumeInput) volumeInput.value = String(v);
            }
          }
        } catch (e) {}

        function drawWaveform() {
          if (!waveformCanvas || !wfCtx) return;
          var w = waveformCanvas.width = waveformCanvas.clientWidth || 400;
          var h = waveformCanvas.height = waveformCanvas.clientHeight || 38;
          wfCtx.clearRect(0, 0, w, h);

          var barCount = 44;
          var barW = (w / barCount) * 0.65;
          var gap = (w - (barCount * barW)) / (barCount - 1);
          var progressRatio = (audioEngine.duration && audioEngine.duration > 0) ? (audioEngine.currentTime / audioEngine.duration) : 0;
          var isPlaying = !audioEngine.paused;
          var now = Date.now() * 0.006;

          for (var b = 0; b < barCount; b++) {
            var barRatio = b / barCount;
            var baseH = Math.sin(b * 0.28) * 0.35 + 0.52;
            var dynamicScale = isPlaying ? (Math.sin(now + b * 0.45) * 0.35 + 0.65) : 0.4;
            var curBarH = Math.max(3, h * baseH * dynamicScale);
            var x = b * (barW + gap);
            var y = (h - curBarH) / 2;

            if (barRatio <= progressRatio) {
              wfCtx.fillStyle = '#FF3B30';
            } else {
              wfCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            }
            wfCtx.fillRect(x, y, barW, curBarH);
          }

          if (!audioEngine.paused) {
            wfAnimId = window.requestAnimationFrame(drawWaveform);
          }
        }

        if (waveformWrap) {
          waveformWrap.addEventListener('click', function(e) {
            if (!audioEngine.duration) return;
            var rect = waveformWrap.getBoundingClientRect();
            var clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            var seekRatio = clickX / rect.width;
            audioEngine.currentTime = seekRatio * audioEngine.duration;
            drawWaveform();
          });
        }

        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (backdrop) backdrop.addEventListener('click', closeModal);

        // Keyboard Accessibility
        document.addEventListener('keydown', function(e) {
          var m = document.getElementById('sonarline-product-modal');
          if (!m || m.style.display === 'none') return;
          if (e.key === 'Escape') {
            closeModal();
          } else if (e.code === 'Space') {
            e.preventDefault();
            if (playBtn) playBtn.click();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            if (audioEngine.duration) {
              audioEngine.currentTime = Math.max(0, audioEngine.currentTime - 5);
              drawWaveform();
            }
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            if (audioEngine.duration) {
              audioEngine.currentTime = Math.min(audioEngine.duration, audioEngine.currentTime + 5);
              drawWaveform();
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            audioEngine.volume = Math.min(1, Math.round((audioEngine.volume + 0.1) * 10) / 10);
            if (volumeInput) volumeInput.value = String(audioEngine.volume);
            try { localStorage.setItem('sonarline_audio_vol', String(audioEngine.volume)); } catch (err) {}
            var deckVol = document.querySelector('.sonarline-deck-vol');
            if (deckVol) deckVol.value = String(audioEngine.volume);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            audioEngine.volume = Math.max(0, Math.round((audioEngine.volume - 0.1) * 10) / 10);
            if (volumeInput) volumeInput.value = String(audioEngine.volume);
            try { localStorage.setItem('sonarline_audio_vol', String(audioEngine.volume)); } catch (err) {}
            var deckVol = document.querySelector('.sonarline-deck-vol');
            if (deckVol) deckVol.value = String(audioEngine.volume);
          }
        });

        if (prevBtn) {
          prevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            allCards = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper, .product-card'));
            if (allCards.length > 0) {
              currentCardIndex = (currentCardIndex - 1 + allCards.length) % allCards.length;
              populateModal(allCards[currentCardIndex]);
            }
          });
        }

        if (nextBtn) {
          nextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            allCards = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper, .product-card'));
            if (allCards.length > 0) {
              currentCardIndex = (currentCardIndex + 1) % allCards.length;
              populateModal(allCards[currentCardIndex]);
            }
          });
        }

        if (playBtn) {
          playBtn.addEventListener('click', function() {
            if (!audioEngine.src) return;
            if (audioEngine.paused) {
              audioEngine.play().catch(function(err) {
                console.error('Audio playback error:', err);
              });
            } else {
              audioEngine.pause();
            }
          });
        }

        if (scrubber) {
          scrubber.addEventListener('input', function() {
            if (audioEngine.duration) {
              var seek = (scrubber.value / 100) * audioEngine.duration;
              audioEngine.currentTime = seek;
              drawWaveform();
            }
          });
        }

        if (volumeInput) {
          volumeInput.addEventListener('input', function() {
            var val = parseFloat(volumeInput.value);
            audioEngine.volume = val;
            try { localStorage.setItem('sonarline_audio_vol', String(val)); } catch (e) {}
            var deckVol = document.querySelector('.sonarline-deck-vol');
            if (deckVol) deckVol.value = String(val);
          });
        }

        audioEngine.addEventListener('play', function() {
          var pb = document.querySelector('.sonarline-audio-play-btn');
          if (pb) {
            var icon = pb.querySelector('.sonarline-audio-icon');
            var text = pb.querySelector('.sonarline-audio-btn-text');
            pb.classList.add('is-playing');
            if (icon) icon.innerHTML = '&#10074;&#10074;';
            if (text) text.textContent = 'PAUSE DEMO';
          }
          var deck = document.getElementById('sonarline-bottom-deck');
          if (deck) {
            var deckPlay = deck.querySelector('.sonarline-deck-playbtn');
            if (deckPlay) deckPlay.innerHTML = '&#10074;&#10074;';
          }
          if (currentActiveCard) {
            var qp = currentActiveCard.querySelector('.sonarline-card-quickplay');
            if (qp) {
              qp.classList.add('is-playing');
              qp.innerHTML = '&#10074;&#10074;';
            }
          }
          if (wfAnimId) window.cancelAnimationFrame(wfAnimId);
          drawWaveform();
        });

        audioEngine.addEventListener('pause', function() {
          var pb = document.querySelector('.sonarline-audio-play-btn');
          if (pb) {
            var icon = pb.querySelector('.sonarline-audio-icon');
            var text = pb.querySelector('.sonarline-audio-btn-text');
            pb.classList.remove('is-playing');
            if (icon) icon.innerHTML = '&#9654;';
            if (text) text.textContent = 'PLAY DEMO';
          }
          var deck = document.getElementById('sonarline-bottom-deck');
          if (deck) {
            var deckPlay = deck.querySelector('.sonarline-deck-playbtn');
            if (deckPlay) deckPlay.innerHTML = '&#9654;';
          }
          var allQuickPlays = document.querySelectorAll('.sonarline-card-quickplay');
          for (var q = 0; q < allQuickPlays.length; q++) {
            allQuickPlays[q].classList.remove('is-playing');
            allQuickPlays[q].innerHTML = '&#9654;';
          }
          drawWaveform();
        });

        audioEngine.addEventListener('timeupdate', function() {
          if (audioEngine.duration) {
            var pct = (audioEngine.currentTime / audioEngine.duration) * 100;
            if (progress) progress.style.width = pct + '%';
            if (scrubber) scrubber.value = pct;
            var timeStr = formatTime(audioEngine.currentTime) + ' / ' + formatTime(audioEngine.duration);
            if (timeEl) timeEl.textContent = timeStr;
            var deck = document.getElementById('sonarline-bottom-deck');
            if (deck) {
              var deckFill = deck.querySelector('.sonarline-deck-scrub-fill');
              if (deckFill) deckFill.style.width = pct + '%';
              var deckTime = deck.querySelector('.sonarline-deck-time');
              if (deckTime) deckTime.textContent = timeStr;
            }
            if (audioEngine.paused) drawWaveform();
          }
        });

        audioEngine.addEventListener('loadedmetadata', function() {
          var durStr = '0:00 / ' + formatTime(audioEngine.duration);
          if (timeEl) timeEl.textContent = durStr;
          var deck = document.getElementById('sonarline-bottom-deck');
          if (deck) {
            var deckTime = deck.querySelector('.sonarline-deck-time');
            if (deckTime) deckTime.textContent = durStr;
          }
          drawWaveform();
        });

        audioEngine.addEventListener('ended', function() {
          stopAudio();
          drawWaveform();
        });
      }
      return modal;
    }

    function closeModal() {
      var modal = document.getElementById('sonarline-product-modal');
      if (modal) {
        modal.style.setProperty('display', 'none', 'important');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('sonarline-modal-open');
      }
      if (audioEngine.paused) {
        stopAudio();
      } else {
        var deck = document.getElementById('sonarline-bottom-deck');
        if (deck) deck.classList.add('sonarline-deck-visible');
      }
    }

    function populateModal(card) {
      if (!card) return;
      var modal = ensureModal();

      allCards = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper, .product-card'));
      currentCardIndex = allCards.indexOf(card);
      currentActiveCard = card;

      // 1. Artwork
      var imgEl = card.querySelector('img');
      var modalImg = modal.querySelector('.sonarline-modal-img');
      if (modalImg) {
        modalImg.src = imgEl ? (imgEl.currentSrc || imgEl.src || '') : '';
        modalImg.alt = imgEl ? (imgEl.alt || 'Product Artwork') : 'Product Artwork';
      }

      // 2. Title
      var titleEl = card.querySelector('.card__heading, .font-section-collection-productName, h3, h4, .product-title, .product-name');
      var title = '';
      if (titleEl) {
        title = (titleEl.textContent || '').replace(/\[\[tags?:\s*[\s\S]*?\]\]/gi, '').replace(/\[\[audio:\s*[\s\S]*?\]\]/gi, '').replace(/\[\[highlighted:\s*(true|false)\s*\]\]/gi, '').trim();
      }
      var modalTitle = modal.querySelector('.sonarline-modal-title');
      if (modalTitle) modalTitle.textContent = title;

      // 3. Tags (strictly conditional, supports multiple)
      var modalTagsWrap = modal.querySelector('.sonarline-modal-tags-wrap');
      if (!modalTagsWrap) {
        var oldModalTag = modal.querySelector('.sonarline-modal-tag-pill');
        if (oldModalTag) {
          modalTagsWrap = document.createElement('div');
          modalTagsWrap.className = 'sonarline-modal-tags-wrap';
          oldModalTag.parentNode.insertBefore(modalTagsWrap, oldModalTag);
          oldModalTag.parentNode.removeChild(oldModalTag);
        }
      }
      if (modalTagsWrap) {
        modalTagsWrap.innerHTML = '';
        var cardTags = [];
        var rawTagsAttr = card.getAttribute('data-tags');
        if (rawTagsAttr) {
          try { cardTags = JSON.parse(rawTagsAttr); } catch (e) {}
        }
        if (!cardTags || cardTags.length === 0) {
          var pillEls = card.querySelectorAll('.sonarline-card-tag-pill, .sonarline-tag-pill');
          for (var pt = 0; pt < pillEls.length; pt++) {
            var ptxt = pillEls[pt].textContent.trim();
            if (ptxt && pillEls[pt].style.display !== 'none' && cardTags.indexOf(ptxt) === -1) {
              cardTags.push(ptxt);
            }
          }
        }
        if (cardTags.length > 0) {
          for (var ti = 0; ti < cardTags.length; ti++) {
            var tp = document.createElement('span');
            tp.className = 'sonarline-card-tag-pill sonarline-modal-tag-pill';
            tp.textContent = cardTags[ti];
            modalTagsWrap.appendChild(tp);
          }
          modalTagsWrap.style.setProperty('display', 'inline-flex', 'important');
        } else {
          modalTagsWrap.style.setProperty('display', 'none', 'important');
        }
      }

      // 4. Price
      var priceEl = card.querySelector('.price, .price-block, [class*="price"]:not(.sonarline-card-price-wrap):not(.sonarline-card-row-bottom)');
      var modalPrice = modal.querySelector('.sonarline-modal-price');
      if (modalPrice) {
        modalPrice.textContent = priceEl ? priceEl.textContent.trim() : '';
      }

    function sonarlineApplySyncedShortcodes(card, data) {

      function liveHeroH1() {

          var root = document.querySelector('[data-section-key="headline"] .section-contents, #content-section-LBNmnP42zK .section-contents, .section-hero .section-contents, [data-section-key="hero"] .section-contents, .hero .section-contents');

      // Format Subtitle Bullets & Center Subtitle and Category List

      for (var se = 0; se < subtitleElements.length; se++) {

        subtitleP.style.setProperty('justify-content', 'center', 'important');
        subtitleP.style.setProperty('align-items', 'center', 'important');
        subtitleP.style.setProperty('margin-left', 'auto', 'important');

      // Format bullets safely on text nodes to prevent destroying descendant DOM elements or nesting spans
      var walker = document.createTreeWalker(heroContents, NodeFilter.SHOW_TEXT, null, false);
      var textNode;
      var textNodesToFormat = [];
      while ((textNode = walker.nextNode())) {

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceNativeHero);
    } else {

  // ==========================================================================
  // Sonarline Footer: Atrum-style newsletter card + link row + [[newsletter-open]]
  // Rebuilds the native footer section around Payhip's own newsletter form
  // (moved, never cloned, so submissions keep working). Idempotent.
  // ==========================================================================
  (function() {
    var OPEN_RE = /\[\[\s*newsletter[\s\-–—]*open\s*:\s*(true|false)\s*\]\]/i;
    var OPEN_RE_G = /\[\[\s*newsletter[\s\-–—]*open\s*:\s*(true|false)\s*\]\]/gi;
    var SOCIAL_RE = /instagram|facebook|twitter|x\.com|tiktok|youtube|discord|spotify|soundcloud|bandcamp|powered by|payhip/i;

    function findFooter() {
      try {
        return document.querySelector('[data-section-key="footer"], #page-section-footer, footer.site-footer, footer');
      } catch (e) {
        return null;
      }
    }

    function scrubToken(root) {
      try {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var node, targets = [];
        while ((node = walker.nextNode())) targets.push(node);
        for (var i = 0; i < targets.length; i++) {
          var n = targets[i];
          if (n.nodeValue && OPEN_RE.test(n.nodeValue)) {
            n.nodeValue = n.nodeValue.replace(OPEN_RE_G, '').trim();
          }
        }
        var leafs = root.querySelectorAll('a, span, h1, h2, h3, h4, p');
        for (var l = 0; l < leafs.length; l++) {
          var el = leafs[l];
          if (el.children.length === 0 && el.textContent && OPEN_RE.test(el.textContent)) {
            el.textContent = el.textContent.replace(OPEN_RE_G, '').trim();
          }
        }
      } catch (e) {}
    }

    function readOpenState(text) {
      try {
        var m = String(text || '').match(OPEN_RE);
        if (m && m[1]) return m[1].toLowerCase() === 'true';
      } catch (e) {}
      return null;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Card title comes from the native footer heading (e.g. "GET EXCLUSIVE DEALS").
    function findNativeTitle(footer) {
      try {
        var heads = footer.querySelectorAll('h1, h2, h3, h4, .heading-text, [class*="title"], [class*="heading"]');
        for (var i = 0; i < heads.length; i++) {
          var h = heads[i];
          if (h.closest && h.closest('.sonarline-footer')) continue;
          var t = (h.textContent || '').replace(/\s+/g, ' ').trim();
          if (t && /exclusive|newsletter|subscribe|stay in|deals|join|sign up/i.test(t)) return t;
        }
      } catch (e) {}
      return null;
    }

    function isVisible(el) {
      try {
        if (!el || !el.isConnected) return false;
        var cs = window.getComputedStyle(el);
        return cs.display !== 'none' && cs.visibility !== 'hidden' && el.offsetParent !== null;
      } catch (e) {
        return true;
      }
    }

    function findNewsletterForm(footer) {
      try {
        var forms = footer.querySelectorAll('form');
        for (var i = 0; i < forms.length; i++) {
          if (forms[i].querySelector('input[type="email"], input[name*="email" i], input[placeholder*="mail" i]')) return forms[i];
        }
        if (forms.length === 1) return forms[0];
      } catch (e) {}
      return null;
    }

    function findEmailControl(scope) {
      try {
        return scope.querySelector('input[type="email"], input[name*="email" i], input[placeholder*="mail" i], input[type="text"]');
      } catch (e) {
        return null;
      }
    }

    function findSubmitControl(scope) {
      try {
        var btns = scope.querySelectorAll('button, input[type="submit"], input[type="button"], a');
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i];
          if (b.tagName === 'A' && !/subscribe|join|submit|sign|arrow|→|newsletter/i.test(b.textContent || '')) continue;
          return b;
        }
      } catch (e) {}
      return null;
    }

    function collectNavLinks(footer, form) {
      var out = [];
      var seen = {};
      try {
        var anchors = footer.querySelectorAll('nav a, [class*="menu"] a, [class*="nav"] a, [role="navigation"] a, ul a, footer a, [data-section-key="footer"] a');
        for (var i = 0; i < anchors.length; i++) {
          var a = anchors[i];
          if (form && form.contains(a)) continue;
          var txt = (a.textContent || '').replace(/\s+/g, ' ').trim();

          if (SOCIAL_RE.test(txt) || SOCIAL_RE.test(href)) continue;
          var key = (txt + '|' + href).toLowerCase();

          seen[key] = true;
          out.push({ text: txt, href: a.href || href });

      return out;
    }

    function isEmptyBlock(el) {
      try {
        if (!el || el === document.body) return false;
        if (el.querySelector('img, svg, canvas, iframe, video, input, button, form')) return false;
        return (el.textContent || '').trim() === '';
      } catch (e) {
        return false;
      }
    }

    function hideIfEmptied(el) {
      try {
        var cur = el, depth = 0;
        while (cur && depth < 3 && isEmptyBlock(cur)) {
          cur.style.setProperty('display', 'none', 'important');
          cur = cur.parentElement;
          depth++;
        }
      } catch (e) {}
    }

    function applyOpenState(box, open) {
      try {
        box.setAttribute('data-newsletter-open', open ? 'true' : 'false');
        var pill = box.querySelector('.sonarline-footer-status');
        var dot = box.querySelector('.sonarline-footer-dot');
        var card = box.querySelector('.sonarline-footer-card');
        var label = pill ? pill.querySelector('.sonarline-footer-status-text') : null;

          if (open) card.classList.remove('is-closed');
          else card.classList.add('is-closed');

        var ctrls = box.querySelectorAll('.sonarline-footer-formrow input, .sonarline-footer-formrow button');
        for (var i = 0; i < ctrls.length; i++) {
          if (open) ctrls[i].removeAttribute('disabled');
          else ctrls[i].setAttribute('disabled', 'disabled');

      } catch (e) {}
    }

    function initSonarlineFooter() {
      try {
        var footer = findFooter();
        if (!footer || !footer.isConnected) return { found: false };

        var rawText = footer.textContent || '';
        var parsed = readOpenState(rawText);

        var existing = footer.querySelector('.sonarline-footer');
        if (existing) {
          scrubToken(footer);
          var stored = existing.getAttribute('data-newsletter-open');

        scrubToken(footer);

        box.className = 'sonarline-footer';

        // Brand mark

        brand.className = 'sonarline-footer-brand';
        brand.innerHTML = '<span class="sonarline-footer-mark">SL</span><span class="sonarline-footer-word">SONARLINE</span>';
        box.appendChild(brand);

        // Newsletter card
        var card = document.createElement('div');
        card.className = 'sonarline-footer-card';
        card.innerHTML =
          '<div class="sonarline-footer-card-top">' +
            '<span class="sonarline-footer-title">' + escapeHtml(titleText) + '</span>' +
            '<span class="sonarline-footer-status"><span class="sonarline-footer-dot"></span><span class="sonarline-footer-status-text">OPEN</span></span>' +
          '</div>' +
          '<p class="sonarline-footer-sub">early access, discounts &amp; free drops. no spam.</p>' +
          '<div class="sonarline-footer-formrow"></div>';

        var formRow = card.querySelector('.sonarline-footer-formrow');

        var form = findNewsletterForm(footer);
        if (form) {
          var email = findEmailControl(form);
          if (email && !email.getAttribute('placeholder')) {
            try { email.setAttribute('placeholder', 'your@email.com'); } catch (e) {}
          }
          var submit = findSubmitControl(form);
          if (submit) {
            try {
              submit.classList.add('sonarline-newsletter-join');
              if (submit.tagName === 'INPUT') submit.value = 'JOIN';
              else submit.textContent = 'JOIN';
            } catch (e) {}
          } else {
            try {
              var join = document.createElement('button');
              join.type = 'submit';
              join.className = 'sonarline-newsletter-join';
              join.textContent = 'JOIN';
              form.appendChild(join);
            } catch (e) {}
          }
          var formParent = form.parentElement;
          formRow.appendChild(form);
          if (formParent) hideIfEmptied(formParent);
        } else {
          try {
            var ghostEmail = document.createElement('input');
            ghostEmail.type = 'email';
            ghostEmail.setAttribute('placeholder', 'your@email.com');
            ghostEmail.setAttribute('disabled', 'disabled');
            var ghostBtn = document.createElement('button');
            ghostBtn.type = 'button';
            ghostBtn.className = 'sonarline-newsletter-join';
            ghostBtn.textContent = 'JOIN';
            ghostBtn.setAttribute('disabled', 'disabled');
            formRow.appendChild(ghostEmail);
            formRow.appendChild(ghostBtn);
          } catch (e) {}
        }

        // Nav row (cloned anchors; originals hidden to avoid duplication)
        var links = collectNavLinks(footer, form);
        if (links.length) {
          var nav = document.createElement('nav');
          nav.className = 'sonarline-footer-nav';
          nav.setAttribute('aria-label', 'Footer');
          for (var li = 0; li < links.length; li++) {
            if (li > 0) {
              var sep = document.createElement('span');
              sep.className = 'sonarline-footer-sep';
              sep.textContent = '\u00b7';
              nav.appendChild(sep);
            }
            var na = document.createElement('a');
            na.href = links[li].href;
            na.textContent = links[li].text;
            nav.appendChild(na);
          }
          box.appendChild(nav);
          try {
            var harvested = footer.querySelectorAll('nav, ul, [role="navigation"], [class*="menu"]');
            for (var hi = 0; hi < harvested.length; hi++) {
              var hc = harvested[hi];
              if (box.contains(hc)) continue;
              if (form && form.contains(hc)) continue;
              if (hc.querySelector('a[href]')) hc.style.setProperty('display', 'none', 'important');
            }
          } catch (e) {}
        }

        // Copyright: move native node if present, else generate.
        var copy = null;
        try {
          var copyCands = footer.querySelectorAll('[class*="copyright"], [class*="copy"], .copyright, small, [class*="rights"]');
          for (var ci = 0; ci < copyCands.length; ci++) {
            if (box.contains(copyCands[ci])) continue;
            if (/©|copyright|all rights/i.test(copyCands[ci].textContent || '')) { copy = copyCands[ci]; break; }
          }
          if (!copy) {
            var walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT, null, false);
            var tn;
            while ((tn = walker.nextNode())) {
              if (box.contains(tn.parentElement)) continue;

            }
          }
        } catch (e) {}
        var copyEl = document.createElement('div');
        copyEl.className = 'sonarline-footer-copy';
        if (copy) {
          copyEl.textContent = (copy.textContent || '').replace(/\s+/g, ' ').trim();
          try {
            if (copy.parentElement) hideIfEmptied(copy.parentElement);
            if (copy.parentNode) copy.parentNode.removeChild(copy);
          } catch (e) {}
        } else {
          copyEl.textContent = '\u00a9 ' + new Date().getFullYear() + ' SONARLINE';
        }
        box.appendChild(copyEl);

        // Hide leftover newsletter-ish headings/text the token lived in.
        try {
          var heads = footer.querySelectorAll('h1, h2, h3, h4, .heading-text, [class*="title"], [class*="heading"]');
          for (var hh = 0; hh < heads.length; hh++) {
            if (box.contains(heads[hh])) continue;
            if (/exclusive|newsletter|subscribe|stay in|get.*deals/i.test(heads[hh].textContent || '')) {
              heads[hh].style.setProperty('display', 'none', 'important');
            }
          }
          var paras = footer.querySelectorAll('p');
          for (var pp = 0; pp < paras.length; pp++) {
            if (box.contains(paras[pp])) continue;
            if (/exclusive deals|newsletter/i.test(paras[pp].textContent || '')) {
              paras[pp].style.setProperty('display', 'none', 'important');
            }
          }
        } catch (e) {}

        footer.insertBefore(box, footer.firstChild);
        applyOpenState(box, open);
        return { found: true, open: open, rebuilt: true, links: links.length, form: !!form };
      } catch (e) {
        return { found: false, error: String(e) };
      }
    }

    window.slFooterDebug = function() {

        var list = [];
        for (var i = 0; i < all.length; i++) {

          } else {

          }
          var anc = [];
          var p = f.parentElement, d = 0;
          while (p && d < 6) {
            try {
              var pcs = window.getComputedStyle(p);
              anc.push(p.tagName + (p.id ? '#' + p.id : '') + ' d=' + pcs.display + ' v=' + pcs.visibility);
              if (pcs.display === 'none') break;

        return { count: all.length, tokenPresent: OPEN_RE.test((document.body && document.body.textContent) || ''), footers: list };
      } catch (e) {

      }
    };
    window.slFooterRebuild = function() {
      try {
        var footer = findFooter();
        var old = footer ? footer.querySelector('.sonarline-footer') : null;
        if (old && old.parentNode) old.parentNode.removeChild(old);
        return initSonarlineFooter();
      } catch (e) {
        return { found: false, error: String(e) };
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSonarlineFooter);
    } else {
      initSonarlineFooter();
    }
    setTimeout(initSonarlineFooter, 800);
    setTimeout(initSonarlineFooter, 2000);
    setTimeout(initSonarlineFooter, 4500);
  })();
