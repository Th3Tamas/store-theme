<!-- LAB DECORATOR — header injection (fonts + early overlay + cache-busted theme CSS)
     Decorator-only. No brand strings. No hardcoded content.
     Full tag parsing + telemetry build lives in footer injection. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    document.documentElement.classList.add('lab-js');
    // Early noise overlay (footer decorator reuses if present — idempotent).
    if (!document.querySelector('.lab-noise-overlay')) {
      var n = document.createElement('div');
      n.className = 'lab-noise-overlay';
      n.setAttribute('aria-hidden', 'true');
      (document.body || document.documentElement).appendChild(n);
    }
    // Cache-busted theme CSS as TEXT (not <link>): the jsDelivr edge mirror can
    // trail the repo by many minutes, while raw.githubusercontent tracks it in
    // seconds — so raw is authoritative. jsDelivr is fetched only if raw fails.
    // A generation guard keeps double-injected loaders from overwriting newer CSS.
    try {
      var cv = Date.now();
      var cssUrls = [
        'https://raw.githubusercontent.com/Th3Tamas/store-theme/main/storewide-store-pages-custom.css?v=' + cv,
        'https://cdn.jsdelivr.net/gh/Th3Tamas/store-theme@main/storewide-store-pages-custom.css?v=' + cv
      ];
      var cssGen = (window.__labCssGen || 0) + 1;
      window.__labCssGen = cssGen;
      var applyCssText = function (css) {
        try {
          var old = document.querySelector('style[data-lab-remote="css-text"]');
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var st = document.createElement('style');
          st.setAttribute('data-lab-remote', 'css-text');
          st.textContent = css;
          document.head.appendChild(st);
        } catch (eApply) {}
      };
      var fetchCss = function (i) {
        if (window.__labCssGen !== cssGen || i >= cssUrls.length) return;
        fetch(cssUrls[i], { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(function (css) {
          if (window.__labCssGen !== cssGen) return;
          applyCssText(css);
        }).catch(function () {
          fetchCss(i + 1);
        });
      };
      fetchCss(0);
    } catch (e3) {}
  } catch (e) { /* no-op: never break native header */ }
})();
</script>
