<!-- LAB REMOTE LOADER — paste entire file contents into Payhip's Embed/Code section.
     Replaces any previous loader (especially any snippet referencing local file paths,
     which browsers block with a Security Error about loading from the file scheme).
     Pulls theme CSS + decorator JS from GitHub via jsDelivr CDN (https only, no local paths).
     Source of truth: https://github.com/Th3Tamas/store-theme/tree/main
     After pasting: hard-refresh the storefront, open DevTools console, expect:
       [Lab loader] fetching theme from CDN...
       [Lab] Initializing decorator... -->
<div id="lab-remote-root"></div>
<script>
(function () {
  if (window.LabDecorator && window.LabDecorator.version) {
    try { window.LabDecorator.rescan(); } catch (e) {}
    return;
  }
  var REPO = 'https://cdn.jsdelivr.net/gh/Th3Tamas/store-theme@main';
  var FALLBACK = 'https://raw.githubusercontent.com/Th3Tamas/store-theme/main';
  var v = Date.now();
  function log(m, d) {
    try { console.log('[Lab loader] ' + m, d === undefined ? '' : d); } catch (e) {}
  }
  function get(urls) {
    var chain = Promise.reject(new Error('start'));
    urls.forEach(function (u) {
      chain = chain.catch(function () {
        return fetch(u, { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + u);
          return r.text();
        });
      });
    });
    return chain;
  }
  function injectCSS(css) {
    var old = document.querySelector('style[data-lab-remote="css"]');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var st = document.createElement('style');
    st.setAttribute('data-lab-remote', 'css');
    st.textContent = css;
    document.head.appendChild(st);
    log('theme CSS injected');
  }
  function injectJS(html) {
    var m = html.match(/<script[^>]*>([\s\S]*?)<\/script\s*>/i);
    if (!m) throw new Error('no script block found in remote JS file');
    var sc = document.createElement('script');
    sc.setAttribute('data-lab-remote', 'js');
    sc.textContent = m[1];
    document.body.appendChild(sc);
    log('decorator JS injected');
  }
  log('fetching theme from CDN...');
  get([REPO + '/storewide-store-pages-custom.css?v=' + v, FALLBACK + '/storewide-store-pages-custom.css?v=' + v])
    .then(injectCSS)
    .catch(function (e) { log('CSS failed', String((e && e.message) || e)); });
  get([REPO + '/storewide-footer-html-js-code-injection.html?v=' + v, FALLBACK + '/storewide-footer-html-js-code-injection.html?v=' + v])
    .then(injectJS)
    .catch(function (e) { log('JS failed', String((e && e.message) || e)); });
})();
</script>
