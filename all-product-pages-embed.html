<!-- ==========================================================================
     SONARLINE AUDIO - PRODUCT PAGES EMBED
     Boutique Hardware Audio Preview Player & Technical Specifications
     ========================================================================== -->

<div class="sonarline-product-page-enhancements">

  <!-- Integrated Hardware Audio Demo Player (Fixed & Redesigned) -->
  <div class="sonarline-audio-player-wrap" id="sonarline-audio-player">
    
    <!-- Player Top Info & Status -->
    <div class="sonarline-player-header">
      <div class="sonarline-player-track-info">
        <div style="width: 8px; height: 8px; background: var(--sl-red); display: inline-block;"></div>
        <span class="sonarline-player-track-title" id="sl-current-title">vocal_edges_demo.wav</span>
        <span class="sonarline-player-track-meta" id="sl-current-meta">Gmaj / 71 BPM</span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--sl-text-muted); letter-spacing: 0.1em;">
        [ LAB PREVIEW ]
      </div>
    </div>

    <!-- Scrubber & Time Display -->
    <div class="sonarline-player-scrubber-wrap">
      <span class="player-time" id="sl-time-elapsed">0:19</span>
      <div class="player-progress-bar" id="sl-progress-bar">
        <div class="player-progress-fill" id="sl-progress-fill" style="width: 42%;"></div>
      </div>
      <span class="player-time" id="sl-time-total">0:45</span>
    </div>

    <!-- Controls Row -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
      <div class="sonarline-player-controls">
        <button type="button" class="player-btn" id="sl-btn-prev" title="Previous Track">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
        <button type="button" class="player-btn play-toggle" id="sl-btn-play" title="Play / Pause">
          <svg id="sl-icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="sl-icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button type="button" class="player-btn" id="sl-btn-next" title="Next Track">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
      </div>

      <!-- Volume & Disclaimer -->
      <div style="display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--sl-text-muted);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <input type="range" id="sl-volume-slider" min="0" max="1" step="0.05" value="0.8" style="width: 70px; accent-color: var(--sl-red); height: 4px;">
      </div>
    </div>

    <!-- Tracklist Folder Drawer -->
    <div class="sonarline-tracklist-drawer">
      <div class="tracklist-folder-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
        <span>00 – STEMS &amp; AUDIO DEMOS</span>
      </div>
      <div class="tracklist-item active" data-track="0" data-title="vocal_edges_demo.wav" data-meta="Gmaj / 71 BPM">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>♫</span>
          <span>vocal – edges (132bpm Am)</span>
        </div>
        <span style="font-size: 0.7rem; color: var(--sl-text-muted);">0:45</span>
      </div>
      <div class="tracklist-item" data-track="1" data-title="vocal_latevelvet_demo.wav" data-meta="Bmaj / 70 BPM">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>♫</span>
          <span>vocal – latevelvet (70bpm Bmaj)</span>
        </div>
        <span style="font-size: 0.7rem; color: var(--sl-text-muted);">0:38</span>
      </div>
      <div class="tracklist-item" data-track="2" data-title="vocal_silkgold_demo.wav" data-meta="Bmaj / 70 BPM">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>♫</span>
          <span>vocal – silkgold (70bpm Bmaj)</span>
        </div>
        <span style="font-size: 0.7rem; color: var(--sl-text-muted);">0:42</span>
      </div>
      <div class="tracklist-item" data-track="3" data-title="synth_starter_loop.wav" data-meta="Fm / 140 BPM">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>♫</span>
          <span>synth – softember (70bpm Fm)</span>
        </div>
        <span style="font-size: 0.7rem; color: var(--sl-text-muted);">0:50</span>
      </div>
    </div>

    <!-- Audio Player Bottom Tagline -->
    <div style="display: flex; justify-content: space-between; margin-top: 1rem; font-family: var(--font-mono); font-size: 0.68rem; color: var(--sl-text-muted);">
      <span>demo samples provided for preview purposes only</span>
      <span style="color: var(--sl-white);">read terms</span>
    </div>

  </div>

</div>
